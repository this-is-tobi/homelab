name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Which gates a change can affect. On a push (not a pull request) every
  # group reports changed, so main always runs the full set.
  classify:
    uses: this-is-tobi/github-workflows/.github/workflows/classify-changes.yml@v0
    permissions:
      pull-requests: read
    with:
      GROUPS: >-
        {"utils": ["utils/*"],
        "charts": ["argo-cd/apps/*", "argo-cd/instances/*", "utils/helm/*", "scripts/ci/test-prometheus-rules*", "scripts/ci/check-dashboards*"],
        "ansible": ["ansible/*"],
        "shell": ["run.sh", "scripts/*"],
        "sonarqube": ["argo-cd/apps/sonarqube/*"],
        "ci": [".github/*"]}

  shellcheck:
    needs: classify
    if: ${{ fromJSON(needs.classify.outputs.groups).shell || fromJSON(needs.classify.outputs.groups).ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run shellcheck
        run: shellcheck -S warning run.sh scripts/*.sh scripts/ci/*.sh
      - name: Test the chart bump decision used by cd.yml
        run: scripts/ci/chart-bump-level.test.sh
      - name: Test the dashboard coverage tool
        run: scripts/dashboard-coverage.test.sh

  # actionlint cannot see remote reusable workflows: a caller granting less
  # than a called job declares only fails on main, as a startup failure.
  workflow-permissions:
    needs: classify
    if: ${{ fromJSON(needs.classify.outputs.groups).ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check reusable-workflow permission grants
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/check-reusable-permissions.sh .github/workflows/*.yml

  ansible-lint:
    needs: classify
    if: ${{ fromJSON(needs.classify.outputs.groups).ansible || fromJSON(needs.classify.outputs.groups).ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install ansible-lint and collections
        run: |
          pip install ansible-lint
          ansible-galaxy collection install -r ansible/collections/requirements.yml
      - name: Provide a dummy vault password + plaintext example vault
        # The committed vault.yml is AES256-encrypted with the operator's key;
        # CI can't (and must not) decrypt it. Substitute the documented
        # plaintext example so lint never depends on decryption behaviour.
        run: |
          echo ci-dummy > ansible/.vault_password
          cp ansible/inventory-example/group_vars/vault.yml ansible/inventory/group_vars/vault.yml
      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint

  helm:
    needs: classify
    if: ${{ fromJSON(needs.classify.outputs.groups).charts || fromJSON(needs.classify.outputs.groups).ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Add chart repositories from Chart.yaml dependencies
        run: |
          set -euo pipefail
          i=0
          for repo in $(yq -N '.dependencies[]?.repository' utils/helm/Chart.yaml argo-cd/apps/*/Chart.yaml 2>/dev/null | grep '^http' | sort -u); do
            i=$((i + 1))
            helm repo add "repo$i" "$repo"
          done
          helm repo update
      - name: Lint, render and validate every chart
        run: |
          set -euo pipefail
          failures=0
          for chart in utils/helm argo-cd/apps/*/; do
            chart="${chart%/}"
            [ -f "$chart/Chart.yaml" ] || continue
            name="$(basename "$chart")"
            # Render each app chart the way production does: against a real
            # instance values file (homelab first, the documented _example
            # template as fallback). Charts with `required` values get them
            # via --set instead.
            args=()
            case "$name" in
              instance-manager) args=(--set instance.name=ci --set repoURL=https://example.com/ci.git) ;;
              *)
                for inst in homelab _example; do
                  for scope in core tenant; do
                    vf="argo-cd/instances/$inst/values/$scope/$name.yaml"
                    if [ -f "$vf" ]; then args=(-f "$vf"); break 2; fi
                  done
                done
                ;;
            esac
            echo "::group::$name ${args[*]:-}"
            if [ -f "$chart/Chart.lock" ]; then
              helm dependency build "$chart" >/dev/null
            fi
            helm lint --quiet "$chart" "${args[@]+"${args[@]}"}"
            # Render and schema-validate. CRD-typed resources (Applications,
            # ClusterPolicies, ...) have no upstream schema — skipped via
            # -ignore-missing-schemas; core types still get checked.
            helm template ci "$chart" "${args[@]+"${args[@]}"}" \
              | kubeconform -ignore-missing-schemas -strict -summary \
              || failures=$((failures + 1))
            echo "::endgroup::"
          done
          exit "$failures"
      - name: Install promtool
        env:
          PROMETHEUS_VERSION: 3.15.0
        run: |
          set -euo pipefail
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          tarball="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/sha256sums.txt" | grep " ${tarball}\$" | sha256sum --check
          sudo tar -xzf "$tarball" -C /usr/local/bin --strip-components=1 \
            "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
      - name: Test the alert-rule and dashboard checks
        run: |
          scripts/ci/test-prometheus-rules.test.sh
          scripts/ci/check-dashboards.test.sh
      - name: Unit-test alert rules
        run: scripts/ci/test-prometheus-rules.sh
      - name: Check dashboards
        run: |
          shopt -s nullglob
          scripts/ci/check-dashboards.sh argo-cd/apps/*/dashboards/*.json \
            argo-cd/apps/prometheus-stack/grafana-dashboards/*.json utils/helm/dashboards/*.json

  sonarqube-plugins:
    needs: classify
    if: ${{ fromJSON(needs.classify.outputs.groups).sonarqube || fromJSON(needs.classify.outputs.groups).ci }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check plugin/server version lockstep and artifact availability
        # The community branch plugin only supports the exact Community Build it
        # was released for, and its version is repeated in five places (install
        # URL, jar filename, both javaagent opts, webapp zip URL). Renovate can
        # propose a server bump the plugins don't support yet, so the invariant
        # is enforced here rather than left to review.
        run: |
          set -uo pipefail
          values=argo-cd/apps/sonarqube/values.yaml
          chart=argo-cd/apps/sonarqube/Chart.yaml
          ref='sonarqube-community-branch-plugin(-|/releases/download/)[0-9]+\.[0-9]+\.[0-9]+'
          fail=0

          build="$(yq '.sonarqube.community.buildNumber' "$values")"
          app="$(yq '.appVersion' "$chart")"
          [ "$app" = "$build" ] \
            || { echo "::error::Chart.yaml appVersion ($app) != community.buildNumber ($build)"; fail=1; }
          # Release tags occasionally carry a suffix the image tag drops
          # (26.5.0.122743b vs 26.5.0.122743-community), so confirm the tag the
          # chart will actually pull exists.
          curl -fsS -o /dev/null --retry 3 \
            "https://hub.docker.com/v2/repositories/library/sonarqube/tags/$build-community" \
            || { echo "::error::no image sonarqube:$build-community"; fail=1; }

          found="$(grep -oE "$ref" "$values" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$' | sort -u | tr '\n' ' ')"
          found="${found% }"
          n="$(grep -oE "$ref" "$values" | wc -l | tr -d ' ')"
          [ "$n" -eq 5 ] \
            || { echo "::error::expected 5 branch-plugin references in $values, found $n"; fail=1; }
          [ "$found" = "${build%.*}" ] \
            || { echo "::error::branch plugin '$found' does not match Community Build $build"; fail=1; }

          while read -r url; do
            [ -n "$url" ] || continue
            curl -fsSL --retry 3 -r 0-0 -o /dev/null "$url" \
              || { echo "::error::unreachable plugin artifact: $url"; fail=1; }
          done <<<"$(yq '.sonarqube.plugins.install[]' "$values"
                    grep -oE 'https://[^ ]+sonarqube-webapp\.zip' "$values")"

          exit "$fail"

  lint-go:
    needs: classify
    if: ${{ fromJSON(needs.classify.outputs.groups).utils || fromJSON(needs.classify.outputs.groups).ci }}
    uses: this-is-tobi/github-workflows/.github/workflows/lint-go.yml@v0
    permissions:
      contents: read
    with:
      WORKING_DIRECTORY: utils
      FORMAT: true
      VET: true
      GOLANGCI_LINT: false

  test-go:
    needs: classify
    if: ${{ fromJSON(needs.classify.outputs.groups).utils || fromJSON(needs.classify.outputs.groups).ci }}
    uses: this-is-tobi/github-workflows/.github/workflows/test-go.yml@v0
    permissions:
      contents: read
    with:
      WORKING_DIRECTORY: utils

  govulncheck:
    needs: classify
    if: ${{ fromJSON(needs.classify.outputs.groups).utils || fromJSON(needs.classify.outputs.groups).ci }}
    uses: this-is-tobi/github-workflows/.github/workflows/scan-govulncheck.yml@v0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      WORKING_DIRECTORY: utils

  # Built, not pushed: the tarball feeds the Trivy scan and nothing reaches
  # the registry from CI.
  build-image:
    needs: classify
    if: ${{ fromJSON(needs.classify.outputs.groups).utils || fromJSON(needs.classify.outputs.groups).ci }}
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@v0
    permissions:
      contents: read
      packages: write
    with:
      IMAGE_NAME: ghcr.io/this-is-tobi/homelab/utils
      IMAGE_TAG: ci-${{ github.sha }}
      IMAGE_DOCKERFILE: utils/Dockerfile
      IMAGE_CONTEXT: utils/
      PUSH: false
      BUILD_AMD64: true
      BUILD_ARM64: true

  scan-image:
    needs: build-image
    uses: this-is-tobi/github-workflows/.github/workflows/scan-trivy.yml@v0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      packages: read
    with:
      IMAGE_ARTIFACT: ${{ needs.build-image.outputs.artifact-prefix }}-amd64

  # Scans the commits this event brings (the pull request, or the push), as
  # gitleaks-action did. The shared workflow's default walks the whole history.
  gitleaks:
    uses: this-is-tobi/github-workflows/.github/workflows/scan-gitleaks.yml@v0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      LOG_OPTS: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.sha) || format('{0}..{1}', github.event.before, github.sha) }}

  lint-commits:
    if: ${{ github.event_name == 'pull_request' }}
    uses: this-is-tobi/github-workflows/.github/workflows/lint-commits.yml@v0
    permissions:
      contents: read

  # The single check to require in branch protection: path-gated jobs that
  # were skipped count as passed.
  ci-status:
    if: ${{ always() }}
    needs:
      - classify
      - shellcheck
      - ansible-lint
      - helm
      - sonarqube-plugins
      - lint-go
      - test-go
      - govulncheck
      - build-image
      - scan-image
      - gitleaks
      - lint-commits
      - workflow-permissions
    uses: this-is-tobi/github-workflows/.github/workflows/check-jobs.yml@v0
    permissions: {}
    with:
      NEEDS: ${{ toJson(needs) }}
      ALLOW_SKIPPED: true
