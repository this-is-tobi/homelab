name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One release at a time: two overlapping runs would race on the release PRs.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens or updates one release PR per package: utils/ (the CLI) and
  # argo-cd/apps (the catalog bundle). Nothing below publishes anything until
  # its PR is merged, and each job below runs only for its own package
  # (scripts/ci/check-release-gating.sh).
  release:
    uses: this-is-tobi/github-workflows/.github/workflows/release-app.yml@v0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    with:
      AUTOMERGE_RELEASE: false
      TAG_MAJOR_AND_MINOR: false
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # `latest` moves with releases only, never with an unreleased main.
  image:
    needs: release
    if: ${{ contains(fromJSON(needs.release.outputs.paths-released), 'utils') }}
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@v0
    permissions:
      contents: read
      packages: write
    with:
      IMAGE_NAME: ghcr.io/this-is-tobi/homelab/utils
      IMAGE_TAG: ${{ fromJSON(needs.release.outputs.release-outputs)['utils--version'] }}
      IMAGE_DOCKERFILE: utils/Dockerfile
      IMAGE_CONTEXT: utils/
      LATEST_TAG: true
      BUILD_AMD64: true
      BUILD_ARM64: true
      BUILD_ARGS: |
        VERSION=${{ fromJSON(needs.release.outputs.release-outputs)['utils--version'] }}
        COMMIT=${{ github.sha }}
        BUILD_DATE=${{ github.event.head_commit.timestamp }}

  attest-image:
    needs: image
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@v0
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      IMAGE_NAME: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
      PROVENANCE: true
      SBOM: true
      SIGN: true

  binaries:
    needs: release
    if: ${{ contains(fromJSON(needs.release.outputs.paths-released), 'utils') }}
    uses: this-is-tobi/github-workflows/.github/workflows/release-go.yml@v0
    # release-go declares packages: write for configurations that push images;
    # GitHub refuses to start the run if the caller grants less, even though
    # this GoReleaser config pushes none.
    permissions:
      contents: write
      packages: write
    with:
      WORKING_DIRECTORY: utils
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  attest-binaries:
    needs:
      - release
      - binaries
    uses: this-is-tobi/github-workflows/.github/workflows/attest-go.yml@v0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      TAG: ${{ fromJSON(needs.release.outputs.release-outputs)['utils--tag_name'] }}
      WORKING_DIRECTORY: utils
      PROVENANCE: true
      SBOM: true
      SIGN: true

  # The catalog bundle: every chart of argo-cd/apps with its dependencies
  # vendored, plus the example instance and the bootstrap chart, as one OCI
  # artifact that an instance pins by version (docs/03-installation.md).
  catalog:
    needs: release
    if: ${{ contains(fromJSON(needs.release.outputs.paths-released), 'argo-cd/apps') }}
    uses: this-is-tobi/github-workflows/.github/workflows/build-oci-artifact.yml@v0
    permissions:
      contents: read
      packages: write
    with:
      ARTIFACT_NAME: ghcr.io/this-is-tobi/homelab/catalog
      ARTIFACT_TAG: ${{ fromJSON(needs.release.outputs.release-outputs)['argo-cd/apps--version'] }}
      ARTIFACT_TYPE: application/vnd.ohmlab.catalog.v1
      BUILD_COMMAND: scripts/build-catalog.sh dist
      ARTIFACT_FILE: dist/catalog.tar.gz
      SETUP_HELM: true

  attest-catalog:
    needs: catalog
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@v0
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      IMAGE_NAME: ${{ needs.catalog.outputs.image }}
      DIGEST: ${{ needs.catalog.outputs.digest }}
      PROVENANCE: true
      SIGN: true

  # What an adopter's Argo CD would meet: an anonymous pull of the digest, the
  # signature and provenance, and every chart rendering from the bundle alone.
  # Re-run this job alone once a first-time package has been made public.
  verify-catalog:
    needs:
      - release
      - catalog
      - attest-catalog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify the published catalog
        env:
          ARTIFACT: ${{ needs.catalog.outputs.image }}@${{ needs.catalog.outputs.digest }}
          VERSION: ${{ fromJSON(needs.release.outputs.release-outputs)['argo-cd/apps--version'] }}
        run: scripts/ci/verify-catalog.sh "$ARTIFACT" "$VERSION"

  # The bootstrap chart, published when its release PR is merged (its version
  # is the one release-please wrote into Chart.yaml).
  publish-chart:
    needs: release
    if: ${{ contains(fromJSON(needs.release.outputs.paths-released), 'utils/helm') }}
    uses: this-is-tobi/github-workflows/.github/workflows/release-helm-local.yml@v0
    permissions:
      contents: read
      packages: write
    with:
      CHART_PATH: utils/helm
      HELM_REPOS: argo=https://argoproj.github.io/argo-helm,this-is-tobi=https://this-is-tobi.github.io/helm-charts

  attest-chart:
    needs: publish-chart
    uses: this-is-tobi/github-workflows/.github/workflows/attest-helm.yml@v0
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      CHARTS: ${{ needs.publish-chart.outputs.published-charts }}
      PROVENANCE: true
      SIGN: true

  # GitHub marks the newest release as "Latest": a chart or catalog release
  # would take it from the product, including one released in the same run.
  keep-latest:
    needs: release
    if: ${{ contains(fromJSON(needs.release.outputs.paths-released), 'argo-cd/apps') || contains(fromJSON(needs.release.outputs.paths-released), 'utils/helm') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Mark the product release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r '.utils' .release-please-manifest.json)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::.release-please-manifest.json holds no product version (utils): '$version'"
            exit 1
          fi
          gh release edit "v$version" --latest --repo "$GITHUB_REPOSITORY"
