{{- if .Values.monitoring.dashboards.enabled }}
{{- /* One ConfigMap per dashboards/*.json, picked up by Grafana's sidecar
       from any namespace; the folder comes from the grafana_folder
       annotation. */}}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Release.Name }}-{{ base $path | trimSuffix ".json" }}-dashboard
  namespace: {{ $.Release.Namespace }}
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ $.Values.monitoring.dashboards.folder | quote }}
data:
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
