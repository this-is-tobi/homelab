version: 2

project_name: ohmlab

builds:
  - id: ohmlab
    main: .
    binary: ohmlab
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/this-is-tobi/homelab/utils/cmd.version={{ .Version }}
      - -X github.com/this-is-tobi/homelab/utils/cmd.commit={{ .FullCommit }}
      - -X github.com/this-is-tobi/homelab/utils/cmd.date={{ .Date }}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# release-please writes the notes and creates the Release; GoReleaser only
# attaches the archives to it.
changelog:
  disable: true
release:
  mode: keep-existing
