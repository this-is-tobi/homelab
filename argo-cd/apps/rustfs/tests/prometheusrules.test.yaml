rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
# Pushed metrics have no scrape target, so TargetDown cannot see RustFS go
# silent: 15m without its target_info fires; a live push never does. The job
# label is the OTLP service.name, which RustFS sets with a capital R and S.
- interval: 1m
  input_series:
  - series: 'target_info{job="RustFS", instance="10.45.1.2"}'
    values: '1x5 _x30'
  alert_rule_test:
  - eval_time: 10m
    alertname: RustFSMetricsAbsent
    exp_alerts: []
  - eval_time: 30m
    alertname: RustFSMetricsAbsent
    exp_alerts:
    - exp_labels: {severity: warning}
      exp_annotations:
        summary: RustFS has stopped pushing metrics
        description: No RustFS metrics reached Prometheus for 15m. Check the RustFS pod, then Alloy's OTLP receiver (otelcol_receiver_* metrics) and the rustfs to Alloy network policy.
# Still pushing at 30m: never fires.
- interval: 1m
  input_series:
  - series: 'target_info{job="RustFS", instance="10.45.1.2"}'
    values: '1x35'
  alert_rule_test:
  - eval_time: 30m
    alertname: RustFSMetricsAbsent
    exp_alerts: []
