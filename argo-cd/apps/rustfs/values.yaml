gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  # Extra gateways to also attach routes to (e.g. during the APISIX→Traefik
  # migration): [{name, namespace?}] — sectionName is reused from the route.
  extraParentRefs: []
  routes: []

# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

rustfs:
  mode:
    standalone:
      enabled: true
    distributed:
      enabled: false

  secret:
    existingSecret: rustfs-admin

  config:
    rustfs:
      address: ":9000"
      console_address: ":9001"
      console_enable: "true"
      # INFO logs every tracing span (new/enter/exit/close), which made
      # RustFS most of the cluster's Loki volume; warnings and errors are
      # what matter here.
      log_level: warn
      region: eu-west-1
      # RustFS rotates its file log hourly; this bounds how many rotated
      # files the cleaner keeps (the chart's `size` knob maps to a variable
      # RustFS doesn't read). The size cap and compression switch live in
      # extraEnv below.
      log_rotation:
        keep_files: 5

  # The chart feeds config.rustfs to the pod via envFrom and has no config
  # checksum, so changes only apply on restart. Bump this value together
  # with any config.rustfs or extraEnv change to roll the pod.
  podAnnotations:
    ohmlab.fr/config-revision: "log-cleanup-512mib-nocompress"

  ingress:
    enabled: false

  gatewayApi:
    enabled: false

  storageclass:
    name: longhorn
    dataStorageSize: 500Gi
    logStorageSize: 1Gi

  # Working set stays around 120-250Mi; a 1Gi request only skewed
  # scheduling on busy nodes.
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 384Mi

  containerSecurityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  # The log cleaner compresses a rotated file before deleting it and keeps
  # the file if compression fails — on a full logs volume nothing was ever
  # freed. Delete without compressing (stdout is mirrored to Loki anyway)
  # and cap the total below the 1Gi volume (the default cap is 2GiB).
  extraEnv:
  - name: RUSTFS_OBS_LOG_COMPRESS_OLD_FILES
    value: "false"
  - name: RUSTFS_OBS_LOG_MAX_TOTAL_SIZE_BYTES
    value: "536870912"

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  vaultAuth:
    default:
      method: kubernetes
      mount: kubernetes
      kubernetes:
        role: rustfs
        serviceAccount: vso
  vaultConnection:
    default:
      address: "https://vault.vault-operator-system.svc.cluster.local:8200"
      skipTLSVerify: false
      caCertSecretRef: vault-tls
  vaultStaticSecrets:
    rustfsAdmin:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: rustfs-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: rustfs-admin
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            RUSTFS_ROOT_USER:
              text: '{{ get .Secrets "admin" | dig "accessKey" "" }}'
            RUSTFS_ROOT_PASSWORD:
              text: '{{ get .Secrets "admin" | dig "secretKey" "" }}'
    rustfsOidc:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: rustfs-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: rustfs-oidc
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            RUSTFS_IDENTITY_OPENID_CLIENT_SECRET:
              # Reads the app's own tenant path (keycloak.clientSecret is
              # ref-copied there from core/keycloak by vault-post-config) —
              # the rustfs role has no read access to core/keycloak.
              text: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'

# RustFS pushes its metrics (OTLP) instead of being scraped, so the usual
# TargetDown cannot notice it going silent; this app alerts on absence.
monitoring:
  prometheusRule:
    enabled: true
