gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  # Extra gateways to also attach routes to (e.g. during the APISIX→Traefik
  # migration): [{name, namespace?}] — sectionName is reused from the route.
  extraParentRefs: []
  routes: []

# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

rustfs:
  mode:
    standalone:
      enabled: true
    distributed:
      enabled: false

  secret:
    existingSecret: rustfs-admin

  config:
    rustfs:
      address: ":9000"
      console_address: ":9001"
      console_enable: "true"
      log_level: info
      region: eu-west-1
      # The chart ships no rotation, so file logs grew until the 1Gi logs
      # volume was full. 100MB x 5 kept files stays well inside it.
      log_rotation:
        size: 100
        keep_files: 5

  # The chart feeds config.rustfs to the pod via envFrom and has no config
  # checksum, so changes only apply on restart. Bump this value together
  # with any config.rustfs change to roll the pod.
  podAnnotations:
    ohmlab.fr/config-revision: "log-rotation-100mb-x5"

  ingress:
    enabled: false

  gatewayApi:
    enabled: false

  storageclass:
    name: longhorn
    dataStorageSize: 500Gi
    logStorageSize: 1Gi

  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 1Gi

  containerSecurityContext:
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true
    runAsNonRoot: true

  extraEnv: []

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  vaultAuth:
    default:
      method: kubernetes
      mount: kubernetes
      kubernetes:
        role: rustfs
        serviceAccount: vso
  vaultConnection:
    default:
      address: "https://vault.vault-operator-system.svc.cluster.local:8200"
      skipTLSVerify: false
      caCertSecretRef: vault-ca
  vaultStaticSecrets:
    rustfsAdmin:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: rustfs-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: rustfs-admin
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            RUSTFS_ROOT_USER:
              text: '{{ get .Secrets "admin" | dig "accessKey" "" }}'
            RUSTFS_ROOT_PASSWORD:
              text: '{{ get .Secrets "admin" | dig "secretKey" "" }}'
    rustfsOidc:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: rustfs-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: rustfs-oidc
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            RUSTFS_IDENTITY_OPENID_CLIENT_SECRET:
              # Reads the app's own tenant path (keycloak.clientSecret is
              # ref-copied there from core/keycloak by vault-post-config) —
              # the rustfs role has no read access to core/keycloak.
              text: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'
