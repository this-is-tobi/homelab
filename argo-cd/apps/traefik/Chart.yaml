apiVersion: v2
type: application
name: traefik
version: 0.1.0
description: >-
  Traefik v3 edge router — the cluster ingress controller and Gateway API
  implementation.
  Stateless: all config lives in the Kubernetes API, no external store,
  no admin API.
dependencies:
- name: traefik
  alias: traefik
  version: 41.7.1
  repository: https://traefik.github.io/charts
- name: vso-utils
  alias: vso
  version: 2.1.0
  repository: https://this-is-tobi.github.io/helm-charts
