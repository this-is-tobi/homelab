{{- if index .Values "loki" "enabled" }}
---
# Auto-discovered by the same grafana sidecar mechanism as
# grafana-dashboards/ (see templates/dashboards.yaml) — no manual
# datasource wiring needed in kube-prometheus-stack's own values. Cleanly
# absent when loki.enabled is false.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    # Guards against exactly the drift this hit once already: a Loki
    # datasource first provisioned without an explicit uid (Grafana
    # auto-generates one), then a later change declares uid: loki here.
    # Grafana's provisioning sync can't rewrite an existing datasource's
    # uid in place (reload fails with "data source not found") — it has
    # to be deleted and recreated. No-op on a fresh install (nothing
    # named "Loki" exists yet to delete).
    deleteDatasources:
    - name: Loki
      orgId: 1
    datasources:
    - name: Loki
      # Hardcoded, not auto-generated — matches kube-prometheus-stack's
      # own "prometheus" convention for its default datasource, so
      # community dashboards that hardcode a "loki" datasource uid (a
      # common convention) work without per-dashboard edits.
      uid: loki
      type: loki
      access: proxy
      url: http://{{ .Release.Name }}-loki.{{ .Release.Namespace }}.svc.cluster.local:3100
      isDefault: false
      editable: false
{{- end }}
