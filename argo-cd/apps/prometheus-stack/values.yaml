gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  # Extra gateways to also attach routes to (e.g. during the APISIX→Traefik
  # migration): [{name, namespace?}] — sectionName is reused from the route.
  extraParentRefs: []
  routes: []

# SPECIAL CASE: this namespace's zero-trust bundle (templates/
# networkpolicy.yaml) is ingress-only by design — egressDeny stays false so
# no egress-restricting NetworkPolicy is ever rendered (prometheus
# legitimately scrapes ~every other namespace). Disabled by default — real
# rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: false
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

# Guards on this Prometheus's own footprint (templates/prometheusrule.yaml).
# seriesBudget is the head size the instance must stay under: new scrape
# targets are paid for by dropping unused series elsewhere, never by growth.
monitoring:
  prometheusRule:
    enabled: true
  seriesBudget: 300000

kube-prometheus-stack:
  crds:
    upgradeJob:
      enabled: true
      forceConflicts: true
      # The chart defaults the busybox init image to :latest, which the
      # Enforce'd disallow-latest-tag policy rejects (it failed the whole
      # app sync). Pin it.
      image:
        busybox:
          tag: "1.37.0"
      # PreSync hook Job (bzcat init + kubectl apply of the CRDs), re-run on
      # every sync; require-resource-limits flags it without these.
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 512Mi
  # k3s servers expose the shared apiserver/etcd metrics registry on the
  # kubelet /metrics endpoint as well, so every apiserver_*/etcd_* series
  # was scraped twice (job=kubelet on each master, on top of job=apiserver)
  # — over a third of the head. No rule or dashboard reads them through
  # job=kubelet. Lists replace, so the chart's own default drop is restated.
  kubelet:
    serviceMonitor:
      metricRelabelings:
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      - action: drop
        sourceLabels: [__name__]
        regex: (apiserver|etcd)_.+
      # Read by no rule or dashboard (the kubelet dashboard reads
      # rest_client_request_duration and storage_operation_duration).
      - action: drop
        sourceLabels: [__name__]
        regex: (rest_client_rate_limiter_duration_seconds|csi_operations_seconds)_bucket
  # The apiserver is the largest job (~40 % of the head). The rules and the
  # apiserver dashboard read only apiserver_request_sli_duration_seconds;
  # these histograms' buckets are read by nothing (their _sum/_count stay).
  # Lists replace, so the chart's own default bucket drop is restated first.
  kubeApiServer:
    serviceMonitor:
      metricRelabelings:
      - action: drop
        sourceLabels: [__name__, le]
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
      - action: drop
        sourceLabels: [__name__]
        regex: (etcd_request_duration_seconds|apiserver_request_duration_seconds|apiserver_watch_list_duration_seconds|apiserver_request_body_size_bytes|apiserver_watch_cache_read_wait_seconds|apiserver_response_sizes)_bucket
  prometheusOperator:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # Applies to the config-reloader (init + sidecar) in prometheus/alertmanager pods.
    # Idle almost always but bursty on reload: a 100m quota throttled it
    # for most of its CFS periods (CPUThrottlingHigh), so the limit only
    # caps bursts while the request stays at the real footprint.
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 64Mi
  kube-state-metrics:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
  prometheus-node-exporter:
    # Scrapes are short CPU bursts; at a 200m quota the exporter throttled
    # on every node while averaging under 10m.
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 500m
        memory: 128Mi
  # k3s runs the scheduler, controller-manager and embedded etcd inside the
  # k3s server process and exposes their metrics only with the server flags
  # --etcd-expose-metrics and --kube-{controller-manager,scheduler}-arg=
  # bind-address=<node-ip> (ansible k3sExtraServerArgs). Disabled here: the
  # chart's default monitors select Services that do not exist, so they would
  # leave their bundled dashboards permanently blank. An instance whose
  # masters carry those flags enables them with its master IPs as endpoints.
  # kube-proxy stays disabled (not reachable this way).
  kubeControllerManager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  kubeScheduler:
    enabled: false
  alertmanager:
    # Route alerts to Mattermost (Slack-compatible incoming webhook). The
    # webhook URL comes from Vault via the alertmanagerMattermost VSS and is
    # read per-notification, so it can be rotated without a restart.
    config:
      global:
        resolve_timeout: 5m
        slack_api_url_file: /etc/alertmanager/secrets/alertmanager-mattermost/webhookUrl
      route:
        group_by: ["namespace", "alertname"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: mattermost
        routes:
        # Watchdog fires permanently by design (dead-man's switch) — drop it.
        - receiver: "null"
          matchers:
          - alertname = "Watchdog"
      receivers:
      - name: "null"
      - name: mattermost
        slack_configs:
        - channel: "alerts"
          send_resolved: true
    alertmanagerSpec:
      secrets:
      - alertmanager-mattermost
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
  prometheus:
    prometheusSpec:
      # 2Gi proved too small for this scrape load (9 nodes + kube-state +
      # full operator stack): the head hit the limit after ~6h and the pod
      # OOM-looped, paying a multi-minute WAL replay per restart. Keep the
      # limit comfortably above steady-state head size (and WAL replay after
      # a restart, which peaked near 3Gi). The request tracks the ~2Gi
      # steady state: scheduling on a lower figure let it stack with other
      # heavy pods and push a node into memory pressure.
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: 2000m
          memory: 4Gi
      # Prometheus and the Argo CD application controller are the two
      # largest memory consumers; the scheduler kept co-locating them
      # (image locality outweighs free memory), so keep them apart. The
      # chart's default soft self anti-affinity is disabled because it would
      # render a second podAntiAffinity key; with one replica it did nothing.
      podAntiAffinity: ""
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: argocd-system
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: argocd-application-controller
      scrapeConfigSelector:
        matchLabels: {}
      ruleSelector:
        matchLabels: {}
      probeSelector:
        matchLabels: {}
      serviceMonitorSelector:
        matchLabels: {}
      podMonitorSelector:
        matchLabels: {}
      # Hard per-target cap, enforced over every ServiceMonitor/PodMonitor:
      # a target that suddenly exposes far more series fails its scrape
      # (TargetDown, ScrapeSampleLimitHit) instead of growing the head into
      # the memory limit. 1.5x the largest target after the bucket drops.
      enforcedSampleLimit: 45000
      # Exposes scrape_sample_limit for ScrapeNearSampleLimit. The flag is
      # deprecated for the extra_scrape_metrics config option, which the
      # operator has no field for yet.
      enableFeatures:
      - extra-scrape-metrics
      retention: 30d
      # Disk guard: whichever of retention/retentionSize is hit first wins.
      # Sized for the default 100Gi PVC — override alongside storage.
      retentionSize: 90GB
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: [ReadWriteMany]
            resources:
              requests:
                storage: 100Gi
  grafana:
    adminPassword: ""
    # Steady state sits near 500Mi: at a 512Mi limit it ran against the
    # ceiling, /api/health slowed past the liveness timeout and the pod
    # restart-looped.
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # No persistence (below): Grafana keeps no state on local disk once the
    # database is external Postgres, so there's nothing left to chown.
    # Readiness tuned looser than the k8s default (1s timeout) — on this
    # hardware a brief latency spike shouldn't flap the pod out of rotation.
    readinessProbe:
      httpGet:
        path: /api/health
        port: grafana
      timeoutSeconds: 5
      periodSeconds: 10
      failureThreshold: 6
    sidecar:
      # Dashboard/datasource reloads are bursty; at 200m the sidecar was
      # throttled in most CFS periods despite a tiny average.
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
      # Organise our dashboards into Grafana folders via a per-ConfigMap
      # `grafana_folder` annotation (set in templates/dashboards.yaml).
      # foldersFromFilesStructure makes the provisioner mirror the sidecar's
      # per-folder subdirectories into real Grafana folders. Dashboards without
      # the annotation (the stack's own bundled ones) stay in General.
      dashboards:
        folderAnnotation: grafana_folder
        provider:
          foldersFromFilesStructure: true
      # Auto-discovers grafana_datasource: "1"-labeled ConfigMaps (e.g.
      # templates/loki-datasource.yaml). Harmless when none exist.
      datasources:
        enabled: true
    # Exposed via Gateway API HTTPRoute (gateway.routes) — no Ingress.
    ingress:
      enabled: false
    defaultDashboardsTimezone: Europe/Paris
    grafana.ini:
      server:
        root_url: ""
      auth.generic_oauth:
        enabled: true
        name: Keycloak
        allow_sign_up: true
        # client_id: ""
        # client_secret: ""
        scopes: openid email profile roles groups
        email_attribute_path: email
        login_attribute_path: username
        name_attribute_path: full_name
        # auth_url: ""
        # token_url: ""
        # api_url: ""
        allow_assign_grafana_admin: true
        groups_attribute_path: groups
        role_attribute_path: contains(groups[*], '/admin') && 'GrafanaAdmin' || contains(resource_access.grafana-core.roles[*], 'grafanaadmin') && 'GrafanaAdmin' || contains(resource_access.grafana-core.roles[*], 'admin') && 'Admin' || contains(resource_access.grafana-core.roles[*], 'editor') && 'Editor' || 'Viewer'
      # CNPG cluster below (cnpg.*), password via envValueFrom
      # GF_DATABASE_PASSWORD (Grafana's native GF_<SECTION>_<KEY> env
      # override — no ${} interpolation needed in this file).
      database:
        type: postgres
        host: prometheus-stack-pg-cluster-rw:5432
        name: grafana
        user: grafana
        ssl_mode: require

# CNPG PostgreSQL cluster for Grafana (replaces the default embedded SQLite,
# which serialized every request behind a single-writer lock and — combined
# with the old RWX/Longhorn-NFS-backed PVC — caused multi-minute request
# latency and permanent readiness failures under any real load). 2 instances
# for automatic failover; same pattern as every other stateful app here.
cnpg:
  fullnameOverride: prometheus-stack-pg-cluster
  version:
    postgresql: "17"
  cluster:
    # Image resolved for the major above from the shared catalog (see the
    # cloudnative-pg app); bumping `version.postgresql` runs an in-place
    # pg_upgrade.
    imageCatalogRef:
      kind: ClusterImageCatalog
      name: postgresql-standard-trixie
    instances: 2
    # Protects against voluntary disruption (drain/descheduler): with
    # masters excluded from CNPG scheduling and only 2 instances, losing
    # one to an eviction would leave a single replica. A drain on the
    # node hosting a PDB-protected instance needs --disable-eviction/
    # --force until CNPG relocates it first.
    enablePDB: true
    enableSuperuserAccess: false
    # VSO-provided secrets (not operator-generated ones, which every other
    # cnpg cluster in this repo uses): left to itself, CNPG's own Cluster
    # controller races VSO to create prometheus-stack-pg-cluster-app/
    # -admin, and VSO refuses to overwrite a secret it didn't create —
    # whichever one wins, the other errors forever trying to reconcile a
    # secret it doesn't own. Pointing initdb.secret/superuserSecret at the
    # VSO secrets makes CNPG wait for and use them instead of generating
    # its own.
    superuserSecret: prometheus-stack-pg-cluster-admin
    initdb:
      database: grafana
      owner: grafana
      secret:
        name: prometheus-stack-pg-cluster-app
    storage:
      size: 3Gi
    walStorage:
      enabled: true
      size: 1Gi
    postgresql:
      # Caps WAL retained by replication slots: a lagging/dead replica costs
      # a re-clone, not disk pressure on the primary.
      parameters:
        max_slot_wal_keep_size: 512MB
    # Grafana's health check queries this database on every probe; at a
    # 250m quota Postgres was throttled in a third of its CFS periods,
    # which surfaced as Grafana liveness timeouts.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    affinity:
      topologyKey: kubernetes.io/hostname
      # Masters run etcd — keep data-bearing workloads off them.
      nodeSelector:
        node-type: worker
    # PodMonitor for the cnpg_* metrics (chart default is disabled) — the
    # cloudnative-pg Grafana dashboard was showing no data for every cluster
    # in the repo until this was turned on.
    monitoring:
      enabled: true
      prometheusRule:
        # HAWarning fires permanently below 3 instances, and ZoneSpread
        # needs topology.kubernetes.io/zone labels the nodes don't carry.
        excludeRules:
        - CNPGClusterHAWarning
        - CNPGClusterZoneSpreadWarning
      instrumentation:
        # The chart renders this queries ConfigMap but never wires it into
        # the Cluster, so it would only sit there unused.
        logicalReplication: false
  # Disabled: the S3 credentials at this Vault path are still empty
  # placeholders (same as every other app's backup config in this repo).
  # For an already-bootstrapped cluster that's harmless, but the
  # barman-cloud plugin's pre-reconcile hook validates the ObjectStore
  # BEFORE allowing initial bootstrap — with empty credentials it blocks
  # the cluster from ever coming up at all ("Pre-reconcile hook stopped
  # the reconciliation loop" / barman-cloud.cloudnative-pg.io, zero pods
  # created until fixed). Re-enable once real S3 credentials are added to
  # Vault.
  backups:
    enabled: false
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    endpointURL: ""
    destinationPath: "s3://"
    # VSO-managed (never inline keys here). The chart hardcodes the
    # ACCESS_KEY_ID / ACCESS_SECRET_KEY key names.
    secret:
      create: false
      name: prometheus-stack-pg-cluster-backup
    # The chart has no S3 region setting; the barman sidecar picks it up
    # from the standard AWS env var instead.
    instanceSidecarConfiguration:
      env:
      - name: AWS_DEFAULT_REGION
        valueFrom:
          secretKeyRef:
            name: prometheus-stack-pg-cluster-backup
            key: S3_REGION
    # Chart default requests AES256 server-side encryption, which not every
    # S3-compatible store implements — defer to the bucket's own default.
    wal:
      encryption: ""
    data:
      encryption: ""
    retentionPolicy: 30d
    scheduledBackups:
    - name: daily
      schedule: "0 0 0 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  vaultAuth:
    default:
      method: kubernetes
      mount: kubernetes
      kubernetes:
        role: prometheus-stack
        serviceAccount: vso
  vaultConnection:
    default:
      address: "https://vault.vault-operator-system.svc.cluster.local:8200"
      skipTLSVerify: false
      caCertSecretRef: vault-ca
  vaultStaticSecrets:
    monitoringAdmin:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: prometheus-stack-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: monitoring-admin
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "admin" | dig "username" "" }}'
            password:
              text: '{{ get .Secrets "admin" | dig "password" "" }}'
    monitoringSso:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: prometheus-stack-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: monitoring-sso
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            OIDC_CLIENT_ID:
              text: '{{ get .Secrets "keycloak" | dig "clientId" "" }}'
            OIDC_CLIENT_SECRET:
              text: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'
    alertmanagerMattermost:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: prometheus-stack-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: alertmanager-mattermost
        create: true
        type: Opaque
        transformation:
          # Alertmanager only needs the URL; without this the Secret also
          # carries `_raw`, the whole Vault path (Grafana admin, Keycloak and
          # Postgres credentials).
          excludeRaw: true
          excludes:
          - ".*"
          templates:
            # Flat key, declared empty in the vault-operator instance values
            # and set by hand in Vault. While it is empty every notification
            # fails with "unsupported protocol scheme".
            webhookUrl:
              text: '{{ get .Secrets "alertmanagerMattermostWebhookUrl" | default "" }}'
    grafanaDbAdmin:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: prometheus-stack-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: prometheus-stack-pg-cluster-admin
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "admin" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "admin" "password" "" }}'
    grafanaDbApp:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: prometheus-stack-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: prometheus-stack-pg-cluster-app
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "app" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "app" "password" "" }}'
    grafanaPgBackup:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: prometheus-stack-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: prometheus-stack-pg-cluster-backup
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            S3_ENDPOINT:
              text: '{{ get .Secrets "postgres" | dig "s3" "endpoint" "" }}'
            S3_BUCKET_NAME:
              text: '{{ get .Secrets "postgres" | dig "s3" "bucketName" "" }}'
            S3_BUCKET_PREFIX:
              text: '{{ get .Secrets "postgres" | dig "s3" "bucketPrefix" "" }}'
            ACCESS_KEY_ID:
              text: '{{ get .Secrets "postgres" | dig "s3" "accessKey" "" }}'
            ACCESS_SECRET_KEY:
              text: '{{ get .Secrets "postgres" | dig "s3" "secretKey" "" }}'
            S3_REGION:
              text: '{{ get .Secrets "postgres" | dig "s3" "region" "" }}'

# Centralized log aggregation, off by default — enable per-instance.
# `enabled` gates the Helm dependency itself (condition: loki.enabled in
# Chart.yaml); real config lives in the instance override.
loki:
  enabled: false
  # Independent toggle: whether to create + use the dedicated
  # longhorn-single-replica StorageClass (see templates/loki-storageclass.yaml)
  # instead of the cluster default (3x replicated). Off by default so
  # enabling loki alone doesn't silently create a new StorageClass.
  singleReplicaStorage:
    enabled: false

# Ships logs to Loki via loki.source.kubernetes (apiserver pods/log
# subresource — same mechanism `kubectl logs` uses), NOT hostPath file
# tailing. No DaemonSet, no privileged/root access, no dependency on
# which node a pod lands on. `enabled` gates the Helm dependency itself
# (condition: alloy.enabled in Chart.yaml); real config lives in the
# instance override.
alloy:
  enabled: false
