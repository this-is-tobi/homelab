coder:
  coder:
    service:
      type: ClusterIP
    ingress:
      enable: true
      className: nginx
      host: ""
      wildcardHost: "*."
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-dns-prod
      tls:
        enable: true
        secretName: ""
        wildcardSecretName: ""
    envUseClusterAccessURL: false
    env:
    # When enabling: append ?sslmode=require to the DSN — CNPG serves TLS by default.
    - name: CODER_PG_CONNECTION_URL
      value: ""
    - name: CODER_ACCESS_URL
      value: ""
    - name: CODER_OIDC_ISSUER_URL
      value: ""
    - name: CODER_OIDC_CLIENT_ID
      value: ""
    - name: CODER_OIDC_CLIENT_SECRET
      value: ""
    - name: CODER_OIDC_SIGN_IN_TEXT
      value: Login with Keycloak
    - name: CODER_OIDC_SCOPES
      value: "openid,profile,email,groups,roles"
    - name: CODER_OIDC_GROUP_FIELD
      value: groups
    - name: CODER_OIDC_ADMIN_GROUP
      value: admin
    - name: CODER_OIDC_GROUP_AUTO_CREATE
      value: "true"

cnpg:
  fullnameOverride: coder-pg-cluster
  version:
    postgresql: "17"
  cluster:
    # Image resolved for the major above from the shared catalog (see the
    # cloudnative-pg app); bumping `version.postgresql` runs an in-place
    # pg_upgrade.
    imageCatalogRef:
      kind: ClusterImageCatalog
      name: postgresql-standard-trixie
    instances: 3
    enableSuperuserAccess: false
    initdb:
      database: coder
      owner: coder
    storage:
      size: 3Gi
    walStorage:
      enabled: true
      size: 3Gi
    postgresql:
      # Caps WAL retained by replication slots: a lagging/dead replica costs
      # a re-clone, not disk pressure on the primary.
      parameters:
        max_slot_wal_keep_size: 1GB
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    affinity:
      topologyKey: kubernetes.io/hostname
    monitoring:
      instrumentation:
        # The chart renders this queries ConfigMap but never wires it into
        # the Cluster, so it would only sit there unused.
        logicalReplication: false
  backups:
    enabled: false
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    endpointURL: ""
    destinationPath: "s3://"
    # VSO-managed (never inline keys here). The chart hardcodes the
    # ACCESS_KEY_ID / ACCESS_SECRET_KEY key names.
    secret:
      create: false
      name: coder-pg-cluster-backup
    # The chart has no S3 region setting; the barman sidecar picks it up
    # from the standard AWS env var instead.
    instanceSidecarConfiguration:
      env:
      - name: AWS_DEFAULT_REGION
        valueFrom:
          secretKeyRef:
            name: coder-pg-cluster-backup
            key: S3_REGION
    # Chart default requests AES256 server-side encryption, which not every
    # S3-compatible store implements — defer to the bucket's own default.
    wal:
      encryption: ""
    data:
      encryption: ""
    retentionPolicy: 30d
    scheduledBackups:
    - name: daily
      schedule: "0 0 0 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io
