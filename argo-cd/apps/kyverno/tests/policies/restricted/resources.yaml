apiVersion: v1
kind: Pod
metadata:
  name: good-container-level
  namespace: tenant-a
spec:
  containers:
  - image: nginx:1.27
    name: a
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
---
