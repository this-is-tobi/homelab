apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restricted
policies:
- ../../rendered/policies.yaml
resources:
- resources.yaml
results:
- policy: pod-security-restricted
  isValidatingPolicy: true
  kind: Pod
  resources:
  - good-container-level
  - good-pod-level
  - good-net-bind
  - good-uid
  - good-pvc
