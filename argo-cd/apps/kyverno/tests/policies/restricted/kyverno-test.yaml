  - bad-escalation-true
  - bad-nonroot-unset
  - bad-nonroot-false
  - bad-uid-zero
  - bad-seccomp-unset
  - bad-seccomp-unconfined
  - bad-drop-missing
  - bad-add-sys-admin
  - bad-hostpath-volume
  - bad-nfs-volume
  - bad-pod-uid-zero
  result: fail
