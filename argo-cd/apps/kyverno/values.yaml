# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override. This is
# the highest-stakes rollout step in the zero-trust design (fail-closed
# webhook, cluster-wide blast radius if wrong) — enable LAST, after every
# other namespace, with a kubectl-kyverno dry-run validation first.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

kyverno:
  # PolicyExceptions are only honoured from the kyverno namespace, so every
  # exception is GitOps-managed here — workloads cannot self-exempt.
  features:
    policyExceptions:
      enabled: true
      namespace: kyverno
  admissionController:
    # The webhook is fail-closed (failurePolicy: Fail) cluster-wide: with a
    # single replica, one node drain / OOM / eviction stalls ALL pod
    # admission. 2 replicas auto-enables the chart's PodDisruptionBudget and
    # the default soft anti-affinity spreads them across nodes.
    replicas: 2
    # Cluster-wide secrets get/list is REQUIRED, not optional: kyverno only
    # admits a generate rule with synchronize: true if the ADMISSION
    # controller's ServiceAccount can list+get the generated kind (a
    # SubjectAccessReview run while validating the policy, separate from the
    # background controller's write check and absent from the upstream
    # docs). sync-vault-ca's target namespace is a variable, so the grant
    # cannot be scoped by namespace or resourceNames. Without it every UPDATE
    # of sync-vault-ca is denied — including Argo's server-side-diff dry-runs,
    # which turns the whole app's comparison into an error. ConfigMaps (the
    # policy's second target) are already covered by the chart's core role.
    # Renders as ClusterRole kyverno:admission-controller:additional,
    # aggregated into kyverno:admission-controller.
    rbac:
      clusterRole:
        extraResources:
        - apiGroups:
          - ""
          resources:
          - secrets
          verbs:
          - get
          - list
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 384Mi
  backgroundController:
    # Cluster-wide secrets/configmaps write: required by generate rules
    # (sync-vault-ca). This CANNOT be scoped with resourceNames — kyverno
    # validates generate policies at admission with a SubjectAccessReview
    # that carries no resourceName, so a name-scoped role fails that check
    # and the policy is rejected. Kind-scoped + verb-complete is the
    # upstream-documented minimum for generate targets.
    rbac:
      clusterRole:
        extraResources:
        - apiGroups:
          - ""
          resources:
          - secrets
          - configmaps
          # limitranges: generate target of add-default-limitrange
          - limitranges
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - delete
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  cleanupController:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
  reportsController:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

# Per-policy failureAction. Enforce blocks non-compliant admission; Audit
# only reports. baseline / non-root / latest-tag ship as Enforce (no
# expected violations — excluded namespaces are carved out in each policy
# template). resource-limits stays Audit: it is the most likely to reject
# pods created by upstream operators/hooks unexpectedly, which is a worse
# failure mode than a report entry.
policies:
  podSecurityBaseline:
    failureAction: Enforce
  # Restricted PSS profile for TENANT namespaces only (matched via the
  # ohmlab.fr/instance-scope=tenant namespace label set by the
  # instance-manager AppSets). Audit first: review the PolicyReports, fix
  # the offending tenant charts, THEN flip to Enforce.
  podSecurityRestricted:
    failureAction: Audit
  requireNonRoot:
    failureAction: Enforce
  disallowLatestTag:
    failureAction: Enforce
  requireResourceLimits:
    failureAction: Audit
  # Registry allowlist. Audit by default — watch the PolicyReports for
  # registries used by chart-default images before considering Enforce.
  restrictImageRegistries:
    failureAction: Audit
    registries:
    - "docker.io/*"
    - "ghcr.io/*"
    - "quay.io/*"
    - "registry.k8s.io/*"
    - "public.ecr.aws/*"
    # Dual-stack (IPv4+IPv6) Docker/OCI endpoint of the same ECR Public
    # registry; the argo-cd chart pulls redis/haproxy from this hostname.
    - "ecr-public.aws.com/*"
    - "cgr.dev/*"
    # Chart-default registries of apps in the catalogue.
    - "docker.gitea.com/*"
    - "mirror.gcr.io/*"
    - "reg.kyverno.io/*"
  # Generate a default LimitRange in every TENANT namespace
  # (ohmlab.fr/instance-scope=tenant) so containers without explicit
  # resources get sane defaults (prerequisite for flipping
  # requireResourceLimits to Enforce). Core namespaces are excluded on
  # purpose (controller pods with requests only would be capped/rejected).
  # Disabled by default: the injected defaults apply to pods on their next
  # recreation, which can surprise a running cluster — enable deliberately.
  defaultLimitRange:
    enabled: false
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 25m
      memory: 64Mi
