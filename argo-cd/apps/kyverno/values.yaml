# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override. This is
# the highest-stakes rollout step in the zero-trust design (fail-closed
# webhook, cluster-wide blast radius if wrong) — enable LAST, after every
# other namespace, with a kubectl-kyverno dry-run validation first.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

# Metrics, alerts and dashboard for Kyverno itself. The chart's own
# ServiceMonitors (kyverno.*.serviceMonitor) stay off: they cannot carry a
# sampleLimit, so templates/servicemonitor.yaml replaces them.
monitoring:
  enabled: true
  # 2x the largest controller's sample count (~2k on an admission
  # controller). Every policy adds its own series, so re-measure when the
  # policy count grows or two generations of policies run side by side.
  sampleLimit: 4000
  prometheusRule:
    enabled: true
  dashboards:
    enabled: true
    folder: Security

kyverno:
  # Coarser than the chart's 15 buckets; keeps a 2s boundary for the
  # KyvernoAdmissionSlow p95. Applied by the admission controller only
  # after a restart.
  metricsConfig:
    bucketBoundaries: [0.01, 0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 20]
  # PolicyExceptions are only honoured from the kyverno namespace, so every
  # exception is GitOps-managed here — workloads cannot self-exempt.
  features:
    policyExceptions:
      enabled: true
      namespace: kyverno
  admissionController:
    # The webhook is fail-closed (failurePolicy: Fail) cluster-wide: with a
    # single replica, one node drain / OOM / eviction stalls ALL pod
    # admission. 2 replicas auto-enables the chart's PodDisruptionBudget and
    # the default soft anti-affinity spreads them across nodes.
    replicas: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 384Mi
  backgroundController:
    # Write access to the generate target of add-default-limitrange. This
    # CANNOT be scoped with resourceNames: kyverno validates generate
    # policies at admission with a SubjectAccessReview that carries no
    # resourceName, so a name-scoped role fails that check and the policy is
    # rejected. Kind-scoped and verb-complete is the upstream-documented
    # minimum for generate targets. No controller needs Secret access.
    rbac:
      clusterRole:
        extraResources:
        - apiGroups:
          - ""
          resources:
          - limitranges
          verbs:
          - get
          - list
          - watch
          - create
          - update
          - delete
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  cleanupController:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 128Mi
  reportsController:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

# Per-policy failureAction. Enforce blocks non-compliant admission; Audit
# only reports. baseline / non-root / latest-tag / verify-images ship as
# Enforce (no expected violations — excluded namespaces are carved out in
# each policy template, and verify-images only matches images cd.yml
# signs). resource-limits stays Audit: it is the most likely to reject
# pods created by upstream operators/hooks unexpectedly, which is a worse
# failure mode than a report entry.
policies:
  podSecurityBaseline:
    failureAction: Enforce
  # Restricted PSS profile for TENANT namespaces only (matched via the
  # ohmlab.fr/instance-scope=tenant namespace label set by the
  # instance-manager AppSets). Audit first: review the PolicyReports, fix
  # the offending tenant charts, THEN flip to Enforce.
  podSecurityRestricted:
    failureAction: Audit
  requireNonRoot:
    failureAction: Enforce
  disallowLatestTag:
    failureAction: Enforce
  requireResourceLimits:
    failureAction: Audit
  # Registry allowlist. Audit by default — watch the PolicyReports for
  # registries used by chart-default images before considering Enforce.
  restrictImageRegistries:
    failureAction: Audit
    registries:
    - "docker.io/*"
    - "ghcr.io/*"
    - "quay.io/*"
    - "registry.k8s.io/*"
    - "public.ecr.aws/*"
    # Dual-stack (IPv4+IPv6) Docker/OCI endpoint of the same ECR Public
    # registry; the argo-cd chart pulls redis/haproxy from this hostname.
    - "ecr-public.aws.com/*"
    - "cgr.dev/*"
    # Chart-default registries of apps in the catalogue.
    - "docker.gitea.com/*"
    - "mirror.gcr.io/*"
    - "reg.kyverno.io/*"
  # Signature and provenance check for the images this repository publishes
  # (the ohmlab CLI the vault-post-config Job runs). cd.yml signs them
  # keyless through the shared attest-docker workflow and attaches SLSA
  # provenance. The signer identity alone proves little: that workflow is
  # public, so any repository can sign with it. The provenance's source
  # repository is what ties an image to this one. Audit reports and admits
  # the pod when the check cannot run; Enforce denies and fails closed: with
  # the registry or Sigstore unreachable, matching pods wait (their
  # controllers retry) while every other pod is unaffected. With
  # networkPolicy.egressDeny, the admission and reports controllers need
  # egress to the registry and to Sigstore (TCP 443).
  verifyImages:
    enabled: true
    failureAction: Enforce
    images:
    - "ghcr.io/this-is-tobi/homelab/*"
    identities:
    - issuer: https://token.actions.githubusercontent.com
      subjectRegExp: '^https://github\.com/this-is-tobi/github-workflows/\.github/workflows/attest-docker\.yml@refs/tags/v[0-9]+(\.[0-9]+)*$'
    # Repositories allowed to build these images. During a repository
    # rename, list both names until every running image is rebuilt.
    sourceRepositories:
    - https://github.com/this-is-tobi/homelab
  # Generate a default LimitRange in every TENANT namespace
  # (ohmlab.fr/instance-scope=tenant) so containers without explicit
  # resources get sane defaults (prerequisite for flipping
  # requireResourceLimits to Enforce). Core namespaces are excluded on
  # purpose (controller pods with requests only would be capped/rejected).
  # Disabled by default: the injected defaults apply to pods on their next
  # recreation, which can surprise a running cluster — enable deliberately.
  defaultLimitRange:
    enabled: false
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 25m
      memory: 64Mi
