{{- $patterns := list }}
{{- range .Values.policies.restrictImageRegistries.registries }}
{{- $patterns = append $patterns (printf "^%s$" (regexQuoteMeta . | replace "\\*" ".*" | replace "\\?" ".")) }}
{{- end }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ include "kyverno.cel.name" (dict "name" "restrict-image-registries" "root" $) }}
  annotations:
    policies.kyverno.io/title: Restrict image registries
    policies.kyverno.io/description: >-
      Images must come from the registries in the cluster allowlist. A name
      without a registry is read as docker.io, and docker.io/library for a
      single-segment name, before matching, as the policy this replaces does.
      failureAction and the allowlist come from values
      (policies.restrictImageRegistries).
spec:
  validationActions: {{ include "kyverno.cel.actions" (dict "failureAction" (.Values.policies.restrictImageRegistries.failureAction | default "Audit") "root" $) }}
  {{- include "kyverno.cel.common" (dict) | nindent 2 }}
  variables:
  - name: allContainers
    expression: >-
      object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  - name: allowedRegistries
    expression: {{ $patterns | toJson | quote }}
  validations:
  - expression: >-
      variables.allContainers.all(c,
        variables.allowedRegistries.exists(p,
          (c.image.split('/').size() > 1 &&
           (c.image.split('/')[0].contains('.') || c.image.split('/')[0].contains(':') || c.image.split('/')[0] == 'localhost')
             ? c.image
             : 'docker.io/' + (c.image.split('/').size() == 1 ? 'library/' : '') + c.image).matches(p)))
    message: >-
      Image registry is not in the cluster allowlist
      ({{ .Values.policies.restrictImageRegistries.registries | join ", " }}).
