apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ include "kyverno.cel.name" (dict "name" "pod-security-restricted" "root" $) }}
  annotations:
    policies.kyverno.io/title: Enforce Pod Security Standards (Restricted) on tenant namespaces
    policies.kyverno.io/description: >-
      The restricted-only Pod Security Standards controls for TENANT namespaces
      (ohmlab.fr/instance-scope=tenant, labelled by the instance-manager
      AppSets). Tenant pods are also checked by pod-security-baseline, which
      together equal the restricted profile. failureAction comes from values
      (policies.podSecurityRestricted).
spec:
  validationActions: {{ include "kyverno.cel.actions" (dict "failureAction" (.Values.policies.podSecurityRestricted.failureAction | default "Audit") "root" $) }}
  {{- include "kyverno.cel.common" (dict "namespaceSelector" (dict "matchLabels" (dict "ohmlab.fr/instance-scope" "tenant"))) | nindent 2 }}
  variables:
  - name: allContainers
    expression: >-
      object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  - name: imageExemptions
    expression: >-
      exceptions.allowedValues.filter(v, v.contains('@')).map(v, v.split('@', 2))
  validations:
  - expression: >-
      'volume-types' in exceptions.allowedValues ||
      object.spec.?volumes.orValue([]).all(v,
        has(v.configMap) || has(v.csi) || has(v.downwardAPI) || has(v.emptyDir) ||
        has(v.ephemeral) || has(v.persistentVolumeClaim) || has(v.projected) || has(v.secret))
    message: Only configMap, csi, downwardAPI, emptyDir, ephemeral, persistentVolumeClaim, projected and secret volumes are allowed.
  - expression: >-
      'privilege-escalation' in exceptions.allowedValues ||
      variables.allContainers.all(c,
        c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false ||
        variables.imageExemptions.exists(e, e[0] == 'privilege-escalation' && c.image.matches(e[1])))
    message: Every container must set allowPrivilegeEscalation to false.
  - expression: >-
      'running-as-non-root' in exceptions.allowedValues ||
      (object.spec.?securityContext.?runAsNonRoot.orValue(false) == true &&
       variables.allContainers.all(c, c.?securityContext.?runAsNonRoot.orValue(true) == true)) ||
      variables.allContainers.all(c, c.?securityContext.?runAsNonRoot.orValue(false) == true)
    message: runAsNonRoot must be true at the pod level or on every container, and never false.
  - expression: >-
      'running-as-non-root-user' in exceptions.allowedValues ||
      (object.spec.?securityContext.?runAsUser.orValue(1) != 0 &&
       variables.allContainers.all(c, c.?securityContext.?runAsUser.orValue(1) != 0))
    message: runAsUser must not be 0.
  - expression: >-
      'seccomp-strict' in exceptions.allowedValues ||
      (object.spec.?securityContext.?seccompProfile.?type.orValue('') in ['RuntimeDefault', 'Localhost'] &&
       variables.allContainers.all(c, c.?securityContext.?seccompProfile.?type.orValue('RuntimeDefault') in ['RuntimeDefault', 'Localhost'])) ||
      variables.allContainers.all(c, c.?securityContext.?seccompProfile.?type.orValue('') in ['RuntimeDefault', 'Localhost'])
    message: The seccomp profile must be set explicitly to RuntimeDefault or Localhost, at the pod level or on every container.
  - expression: >-
      'capabilities-strict' in exceptions.allowedValues ||
      variables.allContainers.all(c,
        (c.?securityContext.?capabilities.?drop.orValue([]).exists(x, x == 'ALL') &&
         c.?securityContext.?capabilities.?add.orValue([]).all(x, x == 'NET_BIND_SERVICE')) ||
        variables.imageExemptions.exists(e, e[0] == 'capabilities-strict' && c.image.matches(e[1])))
    message: Containers must drop ALL capabilities and may only add NET_BIND_SERVICE.
