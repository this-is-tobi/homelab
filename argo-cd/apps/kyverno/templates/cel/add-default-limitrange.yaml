{{- if .Values.policies.defaultLimitRange.enabled }}
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: {{ include "kyverno.cel.name" (dict "name" "add-default-limitrange" "root" $) }}
  annotations:
    policies.kyverno.io/title: Add default LimitRange to managed namespaces
    policies.kyverno.io/description: >-
      Generates a LimitRange with default requests/limits in every TENANT
      namespace (ohmlab.fr/instance-scope=tenant). Containers that declare
      nothing inherit these on their next (re)creation, which is the
      prerequisite for flipping requireResourceLimits to Enforce without
      breaking operator-created pods. Core namespaces are excluded on purpose
      (controller pods with requests only would be capped or rejected).
spec:
  evaluation:
    # No synchronization on purpose: the LimitRange is a starting point that
    # operators may tune per namespace without Kyverno reverting them.
    synchronize:
      enabled: false
    generateExisting:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchLabels:
        ohmlab.fr/instance-scope: tenant
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["namespaces"]
  variables:
  - name: nsName
    expression: object.metadata.name
  - name: limitrange
    expression: >-
      [{
        "apiVersion": dyn("v1"),
        "kind": dyn("LimitRange"),
        "metadata": dyn({"name": "default-limits", "namespace": string(variables.nsName)}),
        "spec": dyn({"limits": [{"type": "Container",
          "default": {{ .Values.policies.defaultLimitRange.default | toJson }},
          "defaultRequest": {{ .Values.policies.defaultLimitRange.defaultRequest | toJson }}}]})
      }]
  generate:
  - expression: generator.Apply(variables.nsName, variables.limitrange)
{{- end }}
