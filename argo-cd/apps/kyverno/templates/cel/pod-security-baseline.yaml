{{- $ns := list
  "kube-system" "kyverno"
  "longhorn-system" "prometheus-stack"
  "crowdsec"
  "vault-operator-system" }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ include "kyverno.cel.name" (dict "name" "pod-security-baseline" "root" $) }}
  annotations:
    policies.kyverno.io/title: Enforce Pod Security Standards (Baseline)
    policies.kyverno.io/description: >-
      The Pod Security Standards baseline profile, one validation per control
      (the CEL types have no podSecurity subrule). A PolicyException exempts a
      control with allowedValues "<control>", or one container image with
      "<control>@<regex>" for the container-level controls. failureAction comes
      from values (policies.podSecurityBaseline).
    # System components that legitimately need privileged / hostNetwork /
    # hostPath: longhorn-system, prometheus-stack, crowdsec (log agent hostPath).
    # vault-operator-system: bank-vaults adds IPC_LOCK to the vault container
    # unconditionally; inert here (disable_mlock), but baseline forbids any
    # non-default added capability.
spec:
  validationActions: {{ include "kyverno.cel.actions" (dict "failureAction" (.Values.policies.podSecurityBaseline.failureAction | default "Audit") "root" $) }}
  {{- include "kyverno.cel.common" (dict "namespaceSelector" (include "kyverno.cel.excludeNamespaces" $ns | fromYaml)) | nindent 2 }}
  variables:
  - name: allContainers
    expression: >-
      object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  - name: imageExemptions
    expression: >-
      exceptions.allowedValues.filter(v, v.contains('@')).map(v, v.split('@', 2))
  validations:
  - expression: >-
      'host-process' in exceptions.allowedValues ||
      (object.spec.?securityContext.?windowsOptions.?hostProcess.orValue(false) == false &&
       variables.allContainers.all(c, c.?securityContext.?windowsOptions.?hostProcess.orValue(false) == false))
    message: HostProcess containers are disallowed (windowsOptions.hostProcess must be unset or false).
  - expression: >-
      'host-namespaces' in exceptions.allowedValues ||
      !(object.spec.?hostNetwork.orValue(false) || object.spec.?hostPID.orValue(false) || object.spec.?hostIPC.orValue(false))
    message: Sharing the host namespaces is disallowed (hostNetwork, hostPID and hostIPC must be unset or false).
  - expression: >-
      'privileged' in exceptions.allowedValues ||
      variables.allContainers.all(c,
        c.?securityContext.?privileged.orValue(false) == false ||
        variables.imageExemptions.exists(e, e[0] == 'privileged' && c.image.matches(e[1])))
    message: Privileged containers are disallowed.
  - expression: >-
      'capabilities' in exceptions.allowedValues ||
      variables.allContainers.all(c,
        c.?securityContext.?capabilities.?add.orValue([]).all(cap,
          cap in ['AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD', 'NET_BIND_SERVICE', 'SETFCAP', 'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT']) ||
        variables.imageExemptions.exists(e, e[0] == 'capabilities' && c.image.matches(e[1])))
    message: Adding capabilities beyond the baseline list is disallowed.
  - expression: >-
      'host-path-volumes' in exceptions.allowedValues ||
      object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))
    message: HostPath volumes are disallowed.
  - expression: >-
      'host-ports' in exceptions.allowedValues ||
      variables.allContainers.all(c, c.?ports.orValue([]).all(p, p.?hostPort.orValue(0) == 0))
    message: Host ports are disallowed.
  - expression: >-
      'apparmor' in exceptions.allowedValues ||
      (object.spec.?securityContext.?appArmorProfile.?type.orValue('RuntimeDefault') in ['RuntimeDefault', 'Localhost'] &&
       variables.allContainers.all(c, c.?securityContext.?appArmorProfile.?type.orValue('RuntimeDefault') in ['RuntimeDefault', 'Localhost']) &&
       object.metadata.?annotations.orValue({}).all(k,
         !k.startsWith('container.apparmor.security.beta.kubernetes.io/') ||
         object.metadata.annotations[k] == '' || object.metadata.annotations[k] == 'runtime/default' || object.metadata.annotations[k].startsWith('localhost/')))
    message: Only the RuntimeDefault and Localhost AppArmor profiles are allowed.
  - expression: >-
      'selinux' in exceptions.allowedValues ||
      ((object.spec.?securityContext.?seLinuxOptions.?type.orValue('') in ['', 'container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t']) &&
       (object.spec.?securityContext.?seLinuxOptions.?user.orValue('') == '' && object.spec.?securityContext.?seLinuxOptions.?role.orValue('') == '') &&
       variables.allContainers.all(c,
         c.?securityContext.?seLinuxOptions.?type.orValue('') in ['', 'container_t', 'container_init_t', 'container_kvm_t', 'container_engine_t'] &&
         c.?securityContext.?seLinuxOptions.?user.orValue('') == '' && c.?securityContext.?seLinuxOptions.?role.orValue('') == ''))
    message: SELinux type is restricted to the baseline set and user and role must be unset.
  - expression: >-
      'proc-mount' in exceptions.allowedValues ||
      variables.allContainers.all(c, c.?securityContext.?procMount.orValue('Default') == 'Default')
    message: Changing the proc mount from Default is disallowed.
  - expression: >-
      'seccomp' in exceptions.allowedValues ||
      (object.spec.?securityContext.?seccompProfile.?type.orValue('RuntimeDefault') in ['RuntimeDefault', 'Localhost'] &&
       variables.allContainers.all(c, c.?securityContext.?seccompProfile.?type.orValue('RuntimeDefault') in ['RuntimeDefault', 'Localhost']))
    message: The Unconfined seccomp profile is disallowed.
  - expression: >-
      'sysctls' in exceptions.allowedValues ||
      object.spec.?securityContext.?sysctls.orValue([]).all(s,
        s.name in ['kernel.shm_rmid_forced', 'net.ipv4.ip_local_port_range', 'net.ipv4.tcp_syncookies', 'net.ipv4.ping_group_range',
                   'net.ipv4.ip_unprivileged_port_start', 'net.ipv4.ip_local_reserved_ports', 'net.ipv4.tcp_keepalive_time',
                   'net.ipv4.tcp_fin_timeout', 'net.ipv4.tcp_keepalive_intvl', 'net.ipv4.tcp_keepalive_probes',
                   'net.ipv4.tcp_rmem', 'net.ipv4.tcp_wmem'])
    message: Only the safe sysctls are allowed.
  - expression: >-
      'host-probes-lifecycle' in exceptions.allowedValues ||
      variables.allContainers.all(c,
        [c.?livenessProbe.?httpGet.?host.orValue(''), c.?livenessProbe.?tcpSocket.?host.orValue(''),
         c.?readinessProbe.?httpGet.?host.orValue(''), c.?readinessProbe.?tcpSocket.?host.orValue(''),
         c.?startupProbe.?httpGet.?host.orValue(''), c.?startupProbe.?tcpSocket.?host.orValue(''),
         c.?lifecycle.?postStart.?httpGet.?host.orValue(''), c.?lifecycle.?postStart.?tcpSocket.?host.orValue(''),
         c.?lifecycle.?preStop.?httpGet.?host.orValue(''), c.?lifecycle.?preStop.?tcpSocket.?host.orValue('')].all(h, h == ''))
    message: Probes and lifecycle hooks must not set a host.
