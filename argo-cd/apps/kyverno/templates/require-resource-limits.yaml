{{- $ns := list "kube-system" "kyverno" "longhorn-system" }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/title: Require resource limits
    policies.kyverno.io/description: >-
      Every container, init and ephemeral ones included, must set CPU and
      memory limits. failureAction comes from values
      (policies.requireResourceLimits).
spec:
  validationActions: {{ include "kyverno.cel.actions" (.Values.policies.requireResourceLimits.failureAction | default "Audit") }}
  {{- include "kyverno.cel.common" . | nindent 2 }}
  variables:
  {{- include "kyverno.cel.scope" (dict "exclude" $ns) | nindent 2 }}
  - name: allContainers
    expression: >-
      object.spec.containers + object.spec.?initContainers.orValue([]) + object.spec.?ephemeralContainers.orValue([])
  validations:
  - expression: >-
      variables.outOfScope ||
      variables.allContainers.all(c,
        c.?resources.?limits.?memory.orValue('') != '' && c.?resources.?limits.?cpu.orValue('') != '')
    message: CPU and memory limits are required for all containers.
