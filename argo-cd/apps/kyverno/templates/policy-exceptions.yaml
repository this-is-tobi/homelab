---
# The upstream crowdsec chart hardcodes the agent's wait-for-lapi init
# container resources (memory limit only, no CPU limit) with no values knob.
# The init container runs a short nc wait loop; exempt it from the limits
# policy instead of excluding the whole crowdsec namespace.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: crowdsec-agent-init-limits
  namespace: kyverno
spec:
  exceptions:
  - policyName: require-resource-limits
    ruleNames:
    - require-limits
    - autogen-require-limits
  match:
    any:
    - resources:
        kinds:
        - Pod
        - DaemonSet
        - Deployment
        namespaces:
        - crowdsec
        names:
        - crowdsec-agent*
---
# Same shape as above: the homepage chart hardcodes a config-init busybox
# initContainer (copies the ConfigMap into a writable volume) with no
# resources values knob at all.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: homepage-config-init-limits
  namespace: kyverno
spec:
  exceptions:
  - policyName: require-resource-limits
    ruleNames:
    - require-limits
    - autogen-require-limits
  match:
    any:
    - resources:
        kinds:
        - Pod
        - Deployment
        namespaces:
        - homepage
        names:
        - homepage*
---
# The same hardcoded config-init container also has no securityContext
# knob, so it can never set allowPrivilegeEscalation: false or drop ALL
# capabilities. Exempt only those two restricted controls, only for the
# busybox image; the pod-level controls (runAsNonRoot, seccomp) are met
# via the chart's podSecurityContext, and the homepage container itself
# stays fully checked.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: homepage-config-init-restricted
  namespace: kyverno
spec:
  exceptions:
  - policyName: pod-security-restricted
    ruleNames:
    - restricted
    - autogen-restricted
  match:
    any:
    - resources:
        kinds:
        - Pod
        - Deployment
        namespaces:
        - homepage
        names:
        - homepage*
  podSecurity:
  - controlName: Privilege Escalation
    images:
    - "*busybox:*"
  - controlName: Capabilities
    images:
    - "*busybox:*"
---
# Same shape again: the rustfs chart hardcodes an init-step initContainer
# (creates data/log dirs) with no resources values knob.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: rustfs-init-step-limits
  namespace: kyverno
spec:
  exceptions:
  - policyName: require-resource-limits
    ruleNames:
    - require-limits
    - autogen-require-limits
  match:
    any:
    - resources:
        kinds:
        - Pod
        - Deployment
        - StatefulSet
        namespaces:
        - rustfs
        names:
        - rustfs*
---
# system-upgrade-controller's upgrade Jobs (apply-<plan>-on-<node>-with-<hash>)
# run the k3s installer on the host: hostPID/hostIPC/hostNetwork, the host
# root mounted via hostPath, and a privileged upgrade container with
# CAP_SYS_BOOT, all hardcoded by the controller. Exempt exactly those
# baseline controls; the privileged/capability ones only for the
# k3s-upgrade image. The controller Deployment in the same namespace stays
# fully checked.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: system-upgrade-jobs-baseline
  namespace: kyverno
spec:
  exceptions:
  - policyName: pod-security-baseline
    ruleNames:
    - baseline
    - autogen-baseline
  match:
    any:
    - resources:
        kinds:
        - Pod
        - Job
        namespaces:
        - system-upgrade
        names:
        - apply-*
  podSecurity:
  - controlName: Host Namespaces
  - controlName: HostPath Volumes
  - controlName: Privileged Containers
    images:
    - "*rancher/k3s-upgrade:*"
  - controlName: Capabilities
    images:
    - "*rancher/k3s-upgrade:*"
---
# The same Jobs run as root (the installer writes to the host root) and the
# Plan API has no resources field, so their containers can never set
# runAsNonRoot or limits.
apiVersion: kyverno.io/v2
kind: PolicyException
metadata:
  name: system-upgrade-jobs-root-limits
  namespace: kyverno
spec:
  exceptions:
  - policyName: require-non-root
    ruleNames:
    - require-non-root
    - autogen-require-non-root
  - policyName: require-resource-limits
    ruleNames:
    - require-limits
    - autogen-require-limits
  match:
    any:
    - resources:
        kinds:
        - Pod
        - Job
        namespaces:
        - system-upgrade
        names:
        - apply-*
