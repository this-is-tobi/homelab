apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sync-vault-ca
  annotations:
    policies.kyverno.io/title: Sync Vault CA to all app namespaces
    policies.kyverno.io/description: >-
      Extracts only the ca.crt from vault-operator-system/vault-tls and
      generates a vault-ca secret in namespaces labelled with
      ohmlab.fr/vault-access=true. VSO VaultConnections reference this
      secret via caCertSecretRef.
    # Replace=true only makes Argo write this policy with a PUT instead of a
    # server-side apply. A PUT is still an UPDATE, not delete + create, so it
    # does NOT get past kyverno's admission check: each generate rule's spec
    # outside its generate block (name, match, preconditions, context) is
    # immutable and no generate rule may be removed. To change one, add a new
    # rule next to it.
    # Synchronization is off because nothing reads the generated vault-ca any
    # more (consumers use the bank-vaults vault-tls copy, Traefik uses the
    # trust-manager ConfigMap); the policy is kept only until it is deleted,
    # which leaves the generated objects in place.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  rules:
  - name: sync-vault-ca
    match:
      any:
      - resources:
          kinds:
          - Namespace
          selector:
            matchLabels:
              ohmlab.fr/vault-access: "true"
    preconditions:
      all:
      - key: "{{`{{request.object.metadata.name}}`}}"
        operator: NotIn
        value:
        - kube-system
        - kube-public
        - kube-node-lease
        - default
        - vault-operator-system
        - kyverno
    context:
    - name: caCrt
      apiCall:
        urlPath: /api/v1/namespaces/vault-operator-system/secrets/vault-tls
        jmesPath: "data.\"ca.crt\""
    generate:
      generateExisting: true
      synchronize: false
      apiVersion: v1
      kind: Secret
      name: vault-ca
      namespace: "{{`{{request.object.metadata.name}}`}}"
      data:
        type: Opaque
        data:
          ca.crt: "{{`{{caCrt}}`}}"
  # BackendTLSPolicy (Gateway API) only accepts ConfigMap CA refs with a
  # plain-text ca.crt — generate one next to the vault Service for the
  # traefik HTTPS-upstream validation (vault-operator templates reference it).
  - name: sync-vault-ca-configmap
    match:
      any:
      - resources:
          kinds:
          - Namespace
          names:
          - vault-operator-system
    context:
    - name: caCrt
      apiCall:
        urlPath: /api/v1/namespaces/vault-operator-system/secrets/vault-tls
        jmesPath: "data.\"ca.crt\""
    generate:
      generateExisting: true
      synchronize: false
      apiVersion: v1
      kind: ConfigMap
      name: vault-ca
      namespace: vault-operator-system
      data:
        data:
          ca.crt: "{{`{{caCrt | base64_decode(@)}}`}}"
