{{- with .Values.policies.verifyImages }}
{{- if .enabled }}
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-images
  annotations:
    policies.kyverno.io/title: Verify Image Signatures
    policies.kyverno.io/description: >-
      Images matching policies.verifyImages.images must carry a keyless
      signature from an allowed identity and SLSA provenance naming an
      allowed source repository. failureAction comes from values
      (policies.verifyImages).
spec:
  {{- if eq .failureAction "Enforce" }}
  validationActions: [Deny]
  failurePolicy: Fail
  {{- else }}
  validationActions: [Audit]
  failurePolicy: Ignore
  {{- end }}
  # PolicyReports, and so `ohmlab check`, are fed by the background scan:
  # without it, an Audit failure at admission is recorded nowhere.
  evaluation:
    background:
      enabled: true
  webhookConfiguration:
    # An uncached check fetches the signature, the provenance and the
    # Sigstore trust root; the 10s default leaves no margin for that.
    timeoutSeconds: 20
  # Pods only: the controllers that create them would put every Deployment,
  # ReplicaSet and Job write behind this webhook too, for no extra coverage.
  autogen:
    podControllers:
      controllers: []
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: [v1]
      operations: [CREATE, UPDATE]
      resources: [pods]
  # Evaluated by the API server: pods running none of these images never
  # reach Kyverno, so a slow or degraded Kyverno cannot delay them.
  {{- $patterns := list }}
  {{- range .images }}
  {{- $patterns = append $patterns (printf "^%s$" (regexQuoteMeta . | replace "\\*" ".*" | replace "\\?" ".")) }}
  {{- end }}
  matchConditions:
  - name: runs-a-verified-image
    expression: >-
      (object.spec.containers
      + object.spec.?initContainers.orValue([])
      + object.spec.?ephemeralContainers.orValue([]))
      .exists(c, {{ $patterns | toJson }}.exists(p, c.image.matches(p)))
  # Digests are required (verifyDigest), so rewriting tags to digests is
  # never needed, and skipping it drops the mutating webhook.
  validationConfigurations:
    mutateDigest: false
    verifyDigest: true
    required: true
  matchImageReferences:
  {{- range .images }}
  - glob: {{ . | quote }}
  {{- end }}
  attestors:
  - name: release
    cosign:
      keyless:
        identities:
          {{- toYaml .identities | nindent 10 }}
      ctlog:
        url: https://rekor.sigstore.dev
  attestations:
  - name: provenance
    intoto:
      type: https://slsa.dev/provenance/v1
  variables:
  # images.containers alone leaves init and ephemeral containers unchecked.
  - name: refs
    expression: >-
      images.containers
      + images.?initContainers.orValue([])
      + images.?ephemeralContainers.orValue([])
  - name: sourceRepositories
    expression: {{ .sourceRepositories | toJson | quote }}
  validations:
  - message: image is not signed by an allowed release workflow
    expression: >-
      variables.refs.map(image, verifyImageSignatures(image, [attestors.release])).all(e, e > 0)
  - message: image provenance does not name an allowed source repository
    expression: >-
      variables.refs.map(image,
        verifyAttestationSignatures(image, attestations.provenance, [attestors.release]) > 0
        && extractPayload(image, attestations.provenance).predicate.buildDefinition.externalParameters.workflow.repository
          in variables.sourceRepositories
      ).all(e, e)
{{- end }}
{{- end }}
