gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  # Extra gateways to also attach routes to (e.g. during the APISIX→Traefik
  # migration): [{name, namespace?}] — sectionName is reused from the route.
  extraParentRefs: []
  tlsRoutes: []

# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

server:
  enabled: true
  # Applied to both auth and proxy pods (and their init containers).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # auth-test / proxy-test PreSync hook Jobs (config validation). Upstream
  # sizes them at up to 500Mi; the request stays small since they are
  # short-lived.
  jobResources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  operator:
    enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  auth:
    enabled: true
  proxy:
    enabled: true
  proxyListenerMode: multiplex
  clusterName: ""
  acme: false
  highAvailability:
    certManager:
      enabled: true
      issuerKind: ClusterIssuer
      issuerName: letsencrypt-dns-prod
      addCommonName: true
    replicaCount: 1
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
  # Exposed via Gateway API TLSRoute passthrough (gateway.tlsRoutes) —
  # teleport terminates its own TLS; no Ingress.
  ingress:
    enabled: false
  service:
    type: ClusterIP
  log:
    level: INFO

roles:
  superadmin:
    allow:
      rules:
      - resources:
        - "*"
        verbs:
        - "*"
      kubernetes_groups:
      - system:masters
      kubernetes_labels:
        "*": "*"
      kubernetes_resources:
      - kind: "*"
        namespace: "*"
        name: "*"
        verbs:
        - "*"
  admin:
    allow:
      kubernetes_groups:
      - system:masters
      kubernetes_labels:
        "*": "*"
      kubernetes_resources:
      - kind: "*"
        namespace: "*"
        name: "*"
        verbs:
        - "*"

users: {}

# Metrics, alerts and dashboard for Teleport. The chart's podMonitor stays
# off: it cannot carry a sampleLimit (templates/podmonitors.yaml replaces it).
monitoring:
  enabled: true
  sampleLimit:
    # 2x the auth server's ~960 samples (proxies expose ~200).
    servers: 2000
    # 2x the operator's ~450 samples left after the histogram drop.
    operator: 1000
  prometheusRule:
    enabled: true
  dashboards:
    enabled: true
    folder: Security
