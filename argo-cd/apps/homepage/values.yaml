homepage:
  replicaCount: 1
  # Image, security contexts (Pod Security restricted, read-only root
  # filesystem), probes and resources come from the chart defaults.
  #
  # Hosts accepted in the Host header (HOMEPAGE_ALLOWED_HOSTS). The routes
  # come from this wrapper (gateway.routes), not from the chart, so the chart
  # cannot derive them: list each route hostname here.
  allowedHosts: []
  # Cluster access for the kubernetes widget, pod status and service
  # discovery: mounts the ServiceAccount token and creates a read-only
  # ClusterRole. Off unless a widget or a service uses it.
  kubernetes:
    enabled: false
  service:
    type: ClusterIP
    port: 3000
  config:
    settings:
      title: ""
      favicon: ""
      theme: dark
      color: slate
      headerStyle: clean
      # layout:
      # - Services:
      #     style: row
      #     columns: 3
      # - Admin:
      #     style: row
      #     columns: 3
      # - Utils:
      #     style: row
      #     columns: 2
    bookmarks: []
    # - Developer:
    #     - Github:
    #         - abbr: GH
    #           href: https://github.com/
    services: []
    # - Services:
    #   - Argo-cd:
    #       href: https://gitops.example.com
    #       siteMonitor: https://gitops.example.com
    #       description: Deploy apps using gitops
    #       icon: argo-cd.png
    #   - Gitea:
    #       href: https://git.example.com
    #       siteMonitor: https://git.example.com
    #       description: Private DevOps Platform
    #       icon: gitea.png
    widgets: []
    # The kubernetes widget needs kubernetes.enabled:
    # - kubernetes:
    #     cluster:
    #       show: true
    #       cpu: true
    #       memory: true
    #       showLabel: true
    #       label: cluster
    #     nodes:
    #       show: false
  customCss: ""
  customJs: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  # Extra gateways to also attach routes to (e.g. during the APISIX→Traefik
  # migration): [{name, namespace?}] — sectionName is reused from the route.
  extraParentRefs: []
  routes: []

# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []
