homepage:
  replicaCount: 1
  image:
    repository: ghcr.io/gethomepage/homepage
    pullPolicy: IfNotPresent
    tag: v2.4.0
  # Pod-level so it also covers the chart's hardcoded config-init container,
  # which has no securityContext of its own (restricted PSS). It only copies
  # the ConfigMap into an emptyDir, which needs no root.
  podSecurityContext:
    fsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  # Merged over the chart default (non-root 1000, drop ALL).
  securityContext:
    allowPrivilegeEscalation: false
  serviceAccount:
    create: true
    annotations: {}
    name: ""
  enableRbac: true
  service:
    type: ClusterIP
    port: 3000
    annotations: {}
  # Exposed via Gateway API HTTPRoute (gateway.routes) — no Ingress.
  ingress:
    main:
      enabled: false
  env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "*"
  config:
    kubernetes:
      mode: cluster
    settings:
      title: ""
      favicon: ""
      theme: dark
      color: slate
      headerStyle: clean
      layout: {}
      # - Services:
      #     style: row
      #     columns: 3
      # - Admin:
      #     style: row
      #     columns: 3
      # - Utils:
      #     style: row
      #     columns: 2
    bookmarks: []
    # - Developer:
    #     - Github:
    #         - abbr: GH
    #           href: https://github.com/
    services: []
    # - Services:
    #   - Argo-cd:
    #       href: https://gitops.example.com
    #       siteMonitor: https://gitops.example.com
    #       description: Deploy apps using gitops
    #       icon: argo-cd.png
    #   - Gitea:
    #       href: https://git.example.com
    #       siteMonitor: https://git.example.com
    #       description: Private DevOps Platform
    #       icon: gitea.png
    widgets:
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: false
          cpu: true
          memory: true
          showLabel: true
  customCss: ""
  customJs: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

gateway:
  enabled: false
  gatewayName: ""
  gatewayNamespace: ""
  # Extra gateways to also attach routes to (e.g. during the APISIX→Traefik
  # migration): [{name, namespace?}] — sectionName is reused from the route.
  extraParentRefs: []
  routes: []

# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []
