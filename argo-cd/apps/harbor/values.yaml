harbor:
  existingSecretAdminPassword: harbor-admin
  existingSecretAdminPasswordKey: password
  existingSecretSecretKey: harbor-secretkey
  registry:
    replicas: 1
  portal:
    replicas: 2
  core:
    replicas: 2
  jobservice:
    replicas: 2
  trivy:
    replicas: 2
  exporter:
    replicas: 2
  expose:
    type: ingress
    tls:
      enabled: true
      certSource: secret
      secret:
        secretName: ""
    ingress:
      hosts:
        core: ""
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-dns-prod
  externalURL: ""
  persistence:
    enabled: true
    resourcePolicy: keep
    persistentVolumeClaim:
      registry:
        accessMode: ReadWriteOnce
        size: 5Gi
      jobservice:
        jobLog:
          accessMode: ReadWriteOnce
          size: 1Gi
      redis:
        accessMode: ReadWriteOnce
        size: 1Gi
      trivy:
        accessMode: ReadWriteOnce
        size: 1Gi
    imageChartStorage:
      disableredirect: true
      type: s3
      s3:
        existingSecret: "" # REGISTRY_STORAGE_S3_ACCESSKEY / REGISTRY_STORAGE_S3_SECRETKEY
        region: ""
        bucket: ""
        regionendpoint: "https://s3.example.com"
  database:
    type: external
    external:
      host: harbor-pg-cluster-rw
      port: "5432"
      coreDatabase: harbor
      username: harbor
      existingSecret: harbor-pg-cluster-app
      sslmode: require
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 30s

cnpg:
  fullnameOverride: harbor-pg-cluster
  version:
    postgresql: "17"
  cluster:
    # Image resolved for the major above from the shared catalog (see the
    # cloudnative-pg app); bumping `version.postgresql` runs an in-place
    # pg_upgrade.
    imageCatalogRef:
      kind: ClusterImageCatalog
      name: postgresql-standard-trixie
    instances: 3
    enableSuperuserAccess: false
    initdb:
      database: harbor
      owner: harbor
    storage:
      size: 7Gi
    walStorage:
      enabled: true
      size: 3Gi
    postgresql:
      # Caps WAL retained by replication slots: a lagging/dead replica costs
      # a re-clone, not disk pressure on the primary.
      parameters:
        max_slot_wal_keep_size: 1GB
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    affinity:
      topologyKey: kubernetes.io/hostname
    monitoring:
      instrumentation:
        # The chart renders this queries ConfigMap but never wires it into
        # the Cluster, so it would only sit there unused.
        logicalReplication: false
  backups:
    enabled: false
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    endpointURL: ""
    destinationPath: "s3://"
    # VSO-managed (never inline keys here). The chart hardcodes the
    # ACCESS_KEY_ID / ACCESS_SECRET_KEY key names.
    secret:
      create: false
      name: harbor-pg-cluster-backup
    # The chart has no S3 region setting; the barman sidecar picks it up
    # from the standard AWS env var instead.
    instanceSidecarConfiguration:
      env:
      - name: AWS_DEFAULT_REGION
        valueFrom:
          secretKeyRef:
            name: harbor-pg-cluster-backup
            key: S3_REGION
    # Chart default requests AES256 server-side encryption, which not every
    # S3-compatible store implements — defer to the bucket's own default.
    wal:
      encryption: ""
    data:
      encryption: ""
    retentionPolicy: 30d
    scheduledBackups:
    - name: daily
      schedule: "0 0 0 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  vaultAuth:
    default:
      method: kubernetes
      mount: kubernetes
      kubernetes:
        role: harbor
        serviceAccount: vso
  vaultConnection:
    default:
      address: "https://vault.vault-operator-system.svc.cluster.local:8200"
      skipTLSVerify: false
      caCertSecretRef: vault-ca
  vaultStaticSecrets:
    harborAdmin:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: harbor-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: harbor-admin
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "admin" | dig "username" "" }}'
            password:
              text: '{{ get .Secrets "admin" | dig "password" "" }}'
    harborSecretkey:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: harbor-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: harbor-secretkey
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            secretKey:
              text: '{{ get .Secrets "admin" | dig "secretKey" "" }}'
    harborS3:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: harbor-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: harbor-s3
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            S3_ENDPOINT:
              text: '{{ get .Secrets "s3" | dig "endpoint" "" }}'
            S3_BUCKET_NAME:
              text: '{{ get .Secrets "s3" | dig "bucketName" "" }}'
            S3_BUCKET_PREFIX:
              text: '{{ get .Secrets "s3" | dig "bucketPrefix" "" }}'
            REGISTRY_STORAGE_S3_ACCESSKEY:
              text: '{{ get .Secrets "s3" | dig "accessKey" "" }}'
            REGISTRY_STORAGE_S3_SECRETKEY:
              text: '{{ get .Secrets "s3" | dig "secretKey" "" }}'
            S3_REGION:
              text: '{{ get .Secrets "s3" | dig "region" "" }}'
    harborDbInfos:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: harbor-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: harbor-db-infos
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            DB_URL:
              text: 'postgresql://{{ get .Secrets "postgres" | dig "app" "username" "" }}:{{ get .Secrets "postgres" | dig "app" "password" "" }}@{{ get .Secrets "postgres" | dig "host" "" }}:{{ get .Secrets "postgres" | dig "port" "" }}/{{ get .Secrets "postgres" | dig "database" "" }}'
            DB_HOST:
              text: '{{ get .Secrets "postgres" | dig "host" "" }}'
            DB_PORT:
              text: '{{ get .Secrets "postgres" | dig "port" "" }}'
    harborDbAdmin:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: harbor-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: harbor-pg-cluster-admin
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "admin" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "admin" "password" "" }}'
    harborDbApp:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: harbor-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: harbor-pg-cluster-app
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "app" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "app" "password" "" }}'
    harborPgBackup:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: harbor-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: harbor-pg-cluster-backup
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            S3_ENDPOINT:
              text: '{{ get .Secrets "postgres" | dig "s3" "endpoint" "" }}'
            S3_BUCKET_NAME:
              text: '{{ get .Secrets "postgres" | dig "s3" "bucketName" "" }}'
            S3_BUCKET_PREFIX:
              text: '{{ get .Secrets "postgres" | dig "s3" "bucketPrefix" "" }}'
            ACCESS_KEY_ID:
              text: '{{ get .Secrets "postgres" | dig "s3" "accessKey" "" }}'
            ACCESS_SECRET_KEY:
              text: '{{ get .Secrets "postgres" | dig "s3" "secretKey" "" }}'
            S3_REGION:
              text: '{{ get .Secrets "postgres" | dig "s3" "region" "" }}'
    harborSso:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: harbor-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: harbor-sso
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            OIDC_CLIENT_ID:
              text: '{{ get .Secrets "keycloak" | dig "clientId" "" }}'
            OIDC_CLIENT_SECRET:
              text: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'
