# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

cloudnative-pg:
  crds:
    create: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

plugin-barman-cloud:
  crds:
    create: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# -- Cluster-wide Postgres image catalogs. Every app's CNPG Cluster resolves
# its image through `imageCatalogRef` + its `version.postgresql` major, so a
# patch bump lands here once instead of in each app. Entries mirror the
# upstream catalogs (github.com/cloudnative-pg/artifacts, image-catalogs/)
# and stay digest-pinned; Renovate proposes the bumps.
clusterImageCatalogs:
  postgresql-standard-trixie:
  - major: 17
    image: ghcr.io/cloudnative-pg/postgresql:17.11-202609281634-standard-trixie@sha256:db440678e1eca4f53999f819a6200ceb4b8cd2339c568c9bb0596052d3bc4ac5
  - major: 18
    image: ghcr.io/cloudnative-pg/postgresql:18.6-202609281634-standard-trixie@sha256:f89a40f4d74aa6e0900917eaf6299b125a6382eb02fd4ee5d46f55bcbf7e5726
