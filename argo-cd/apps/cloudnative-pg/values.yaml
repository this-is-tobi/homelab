# Zero-trust NetworkPolicy for this namespace (templates/networkpolicy.yaml).
# Disabled by default — real rules live in the instance override.
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress: []
  extraEgress: []

cloudnative-pg:
  crds:
    create: true
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

plugin-barman-cloud:
  crds:
    create: true
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# -- Cluster-wide Postgres image catalogs. Every app's CNPG Cluster resolves
# its image through `imageCatalogRef` + its `version.postgresql` major, so a
# patch bump lands here once instead of in each app. Entries mirror the
# upstream catalogs (github.com/cloudnative-pg/artifacts, image-catalogs/)
# and stay digest-pinned; Renovate proposes the bumps.
clusterImageCatalogs:
  postgresql-standard-trixie:
  - major: 17
    image: ghcr.io/cloudnative-pg/postgresql:17.11-202609210816-standard-trixie@sha256:09892aaed3919234cf5d6e86abea13870f82d39b84826e9f0926d859a8fba3dc
  - major: 18
    image: ghcr.io/cloudnative-pg/postgresql:18.6-202609210816-standard-trixie@sha256:58d19a1edb30d42fc2be3470ac7719caa496a4f3a7f1289472d6c3f6b04c8fd1
