{{- if .Values.networkPolicy.enabled }}
---
# ⚠ CNI CAVEAT: these are standard NetworkPolicy objects and any compliant
# CNI enforces them, but the specific rules were designed and verified
# against Cilium. Three behaviours differ between CNIs and were relied on
# here: whether kubelet probes are subject to policy at all (they are not,
# under this setup — so no rule allows them); that egress to the apiserver
# is matched post-DNAT against the real node IP rather than the Service
# ClusterIP; and that apiserver->webhook ingress arrives with a pod-CIDR
# identity rather than the calling node's IP. If you run a different CNI,
# re-verify those three before trusting this to be neither over-permissive
# nor accidentally blocking (start with one namespace, watch for dropped
# flows and failing webhooks/probes).
#
# Deny-all baseline. Ingress always denied; egress only when egressDeny is
# true (prometheus-stack is the one exception in this rollout — it
# legitimately needs to reach ~every namespace to scrape it, so it sets
# egressDeny: false and gets no egress policy at all).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  {{- if .Values.networkPolicy.egressDeny }}
  - Egress
  {{- end }}
---
# Any pod in this namespace can reach any other pod in this namespace, any
# port. Deliberately unscoped by port — e.g. Longhorn's dynamic
# 10000-30000 engine replica-sync range would break under a fixed list.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  {{- if .Values.networkPolicy.egressDeny }}
  - Egress
  {{- end }}
  ingress:
  - from:
    - podSelector: {}
  {{- if .Values.networkPolicy.egressDeny }}
  egress:
  - to:
    - podSelector: {}
  {{- end }}
{{- if .Values.networkPolicy.egressDeny }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
{{- end }}
{{- if .Values.networkPolicy.prometheusScrapePorts }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: prometheus-stack
    ports:
      {{- toYaml .Values.networkPolicy.prometheusScrapePorts | nindent 6 }}
{{- end }}
{{- /*
extraIngress / extraEgress: lists of {name, podSelector?, rules} groups.
Each group renders its OWN NetworkPolicy scoped to `podSelector` (defaults
to {} = every pod in the namespace). Lets a namespace with several
distinct workloads scope each rule to exactly the pod it applies to,
rather than namespace-wide.
*/}}
{{- range $i, $group := .Values.networkPolicy.extraIngress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-extra-ingress-{{ $group.name | default $i }}
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    {{- toYaml ($group.podSelector | default (dict)) | nindent 4 }}
  policyTypes:
  - Ingress
  ingress:
    {{- toYaml $group.rules | nindent 4 }}
{{- end }}
{{- if .Values.networkPolicy.egressDeny }}
{{- range $i, $group := .Values.networkPolicy.extraEgress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-extra-egress-{{ $group.name | default $i }}
  namespace: {{ $.Release.Namespace }}
spec:
  podSelector:
    {{- toYaml ($group.podSelector | default (dict)) | nindent 4 }}
  policyTypes:
  - Egress
  egress:
    {{- toYaml $group.rules | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
