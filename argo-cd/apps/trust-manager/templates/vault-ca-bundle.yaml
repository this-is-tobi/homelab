{{- if .Values.vaultCaBundle.enabled }}
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: {{ .Values.vaultCaBundle.name }}
  annotations:
    # The CRD ships with the trust-manager subchart of this same app.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sources:
  - secret:
      name: {{ .Values.vaultCaBundle.sourceSecret }}
      key: ca.crt
  target:
    configMap:
      key: ca.crt
{{- end }}
