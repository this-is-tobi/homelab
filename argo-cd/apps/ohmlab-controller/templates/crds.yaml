{{- /*
The CRDs of the enabled targets, generated by controller-gen into files/crds.
Kept on prune (Argo CD) and on uninstall (Helm): deleting a CRD deletes every
object of the kind, and a controller that goes away must never take the
platform's configuration with it.
*/}}
{{- range $t := (include "ohmlab-controller.enabledTargets" . | fromJsonArray) }}
{{- $file := include "ohmlab-controller.crd" $t }}
{{- if $file }}
{{- $crd := $.Files.Get (printf "files/crds/%s" $file) | fromYaml }}
{{- $_ := set $crd.metadata.annotations "argocd.argoproj.io/sync-options" "Prune=false" }}
{{- $_ := set $crd.metadata.annotations "helm.sh/resource-policy" "keep" }}
{{- $_ := set $crd.metadata.annotations "argocd.argoproj.io/sync-wave" "-1" }}
---
{{ toYaml $crd }}
{{- end }}
{{- end }}
