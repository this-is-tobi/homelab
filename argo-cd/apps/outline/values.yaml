outline:
  image:
    repository: ghcr.io/this-is-tobi/mirror/outline
    tag: 1.9.2
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns-prod
    hosts:
    - host: ""
      paths:
      - path: /
        pathType: Prefix
    tls:
    - hosts:
      - ""
      secretName: ""
  url: ""
  defaultLanguage: en_US
  # The chart auto-generates SECRET_KEY/UTILS_SECRET when no external secret is
  # given, which would re-roll them on every render and invalidate every stored
  # session and encrypted field. Both come from Vault instead.
  secretKeyExternalSecret:
    name: outline-config
    key: SECRET_KEY
  utilsSecretExternalSecret:
    name: outline-config
    key: UTILS_SECRET
  fileStorage:
    mode: s3
    uploadMaxSize: "26214400"
    s3:
      existingSecret: outline-s3
      accessKeyIdSecretKey: S3_ACCESS_KEY
      secretAccessKeySecretKey: S3_SECRET_KEY
      bucket: outline
      bucketUrl: ""
      region: ""
      forcePathStyle: true
      acl: private
  auth:
    oidc:
      enabled: true
      clientId: outline
      authUri: ""
      tokenUri: ""
      userInfoUri: ""
      usernameClaim: email
      displayName: Keycloak
      scopes:
      - openid
      - profile
      - email
      - groups
      - roles
      existingSecret:
        name: outline-sso
        clientSecretKey: OIDC_CLIENT_SECRET
  # Bundled subcharts are all off: postgres is the CNPG cluster below, redis is
  # the valkey release below, and object storage is external.
  redis:
    enabled: false
  postgresql:
    enabled: false
  minio:
    enabled: false
  externalRedis:
    host: outline-valkey
    port: 6379
    existingSecret: outline-valkey-auth
    usernameSecretKey: username
    passwordSecretKey: password
  externalPostgresql:
    host: outline-pg-cluster-rw
    port: 5432
    username: outline
    database: outline
    existingSecret: outline-pg-cluster-app
    passwordSecretKey: password
  database:
    sslMode: require
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: "1"

valkey:
  fullnameOverride: outline-valkey
  architecture: standalone
  replicaCount: 1
  # Password auth — delivered from Vault via VSO (outline-valkey-auth secret);
  # outline reads host/port/username/password and assembles the ioredis URL in
  # its entrypoint.
  auth:
    enabled: true
    existingSecret: outline-valkey-auth
    existingSecretPasswordKey: password
  # Plain TCP: the outline chart's entrypoint builds the ioredis connection
  # from host/port/username/password only, so it has no way to carry a CA or
  # switch the scheme to TLS.
  tls:
    enabled: false
  service:
    port: 6379
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

cnpg:
  fullnameOverride: outline-pg-cluster
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10
  mode: primary
  dbName: outline
  credentials:
    username: outline
    password:
    postgresPassword:
  instances: 3
  enableSuperuserAccess: false
  pvcSize:
    data: 3Gi
    wal: 3Gi
  # Caps WAL retained by replication slots: a lagging/dead replica costs
  # a re-clone, not disk pressure on the primary.
  parameters:
    max_slot_wal_keep_size: 1GB
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  affinity:
    topologyKey: kubernetes.io/hostname
  backup:
    enabled: false
    legacyMode: false
    endpointURL: ""
    destinationPath: "s3://<bucket-name>/<bucket-prefix>"
    cron: 0 0 0 * * *
    retentionPolicy: 30d
    compression: gzip
    s3Credentials:
      create: true
      secretName: outline-pg-cluster-backup
      accessKeyId:
        key: accessKeyId
        value: ""
      secretAccessKey:
        key: secretAccessKey
        value: ""
      region:
        key: region
        value: ""

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  vaultAuth:
    default:
      method: kubernetes
      mount: kubernetes
      kubernetes:
        role: outline
        serviceAccount: vso
  vaultConnection:
    default:
      address: "https://vault.vault-operator-system.svc.cluster.local:8200"
      skipTLSVerify: false
      caCertSecretRef: vault-ca
  vaultStaticSecrets:
    outlineConfig:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-config
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            SECRET_KEY:
              text: '{{ get .Secrets "app" | dig "secretKey" "" }}'
            UTILS_SECRET:
              text: '{{ get .Secrets "app" | dig "utilsSecret" "" }}'
    outlineS3:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-s3
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            S3_ACCESS_KEY:
              text: '{{ get .Secrets "s3" | dig "accessKey" "" }}'
            S3_SECRET_KEY:
              text: '{{ get .Secrets "s3" | dig "secretKey" "" }}'
    outlineValkeyAuth:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-valkey-auth
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            # Valkey has no ACL users configured, so outline authenticates as
            # the built-in `default` user with the requirepass secret.
            username:
              text: default
            password:
              text: '{{ get .Secrets "valkey" | dig "password" "" }}'
    outlineDbAdmin:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-pg-cluster-admin
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "admin" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "admin" "password" "" }}'
    outlineDbApp:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-pg-cluster-app
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "app" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "app" "password" "" }}'
    outlinePgBackup:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-pg-cluster-backup
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            S3_ENDPOINT:
              text: '{{ get .Secrets "postgres" | dig "s3" "endpoint" "" }}'
            S3_BUCKET_NAME:
              text: '{{ get .Secrets "postgres" | dig "s3" "bucketName" "" }}'
            S3_BUCKET_PREFIX:
              text: '{{ get .Secrets "postgres" | dig "s3" "bucketPrefix" "" }}'
            S3_ACCESS_KEY:
              text: '{{ get .Secrets "postgres" | dig "s3" "accessKey" "" }}'
            S3_SECRET_KEY:
              text: '{{ get .Secrets "postgres" | dig "s3" "secretKey" "" }}'
            S3_REGION:
              text: '{{ get .Secrets "postgres" | dig "s3" "region" "" }}'
    outlineSso:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-sso
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            OIDC_CLIENT_ID:
              text: '{{ get .Secrets "keycloak" | dig "clientId" "" }}'
            OIDC_CLIENT_SECRET:
              text: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'
