outline:
  image:
    repository: ghcr.io/this-is-tobi/mirror/outline
    tag: 1.10.1
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-dns-prod
    hosts:
    - host: ""
      paths:
      - path: /
        pathType: Prefix
    tls:
    - hosts:
      - ""
      secretName: ""
  url: ""
  defaultLanguage: en_US
  # The chart auto-generates SECRET_KEY/UTILS_SECRET when no external secret is
  # given, which would re-roll them on every render and invalidate every stored
  # session and encrypted field. Both come from Vault instead.
  secretKeyExternalSecret:
    name: outline-config
    key: SECRET_KEY
  utilsSecretExternalSecret:
    name: outline-config
    key: UTILS_SECRET
  fileStorage:
    mode: s3
    uploadMaxSize: "26214400"
    s3:
      existingSecret: outline-s3
      accessKeyIdSecretKey: S3_ACCESS_KEY
      secretAccessKeySecretKey: S3_SECRET_KEY
      bucket: outline
      bucketUrl: ""
      region: ""
      forcePathStyle: true
      acl: private
  auth:
    oidc:
      enabled: true
      clientId: outline
      authUri: ""
      tokenUri: ""
      userInfoUri: ""
      usernameClaim: email
      displayName: Keycloak
      scopes:
      - openid
      - profile
      - email
      - groups
      - roles
      existingSecret:
        name: outline-sso
        clientSecretKey: OIDC_CLIENT_SECRET
  # Bundled subcharts are all off: postgres is the CNPG cluster below, redis is
  # the valkey release below, and object storage is external.
  redis:
    enabled: false
  postgresql:
    enabled: false
  minio:
    enabled: false
  externalRedis:
    host: outline-valkey
    port: 6379
    existingSecret: outline-valkey-auth
    usernameSecretKey: username
    passwordSecretKey: password
  externalPostgresql:
    host: outline-pg-cluster-rw
    port: 5432
    username: outline
    database: outline
    existingSecret: outline-pg-cluster-app
    passwordSecretKey: password
  database:
    sslMode: require
  resources:
    requests:
      memory: 512Mi
      cpu: 250m
    limits:
      memory: 1Gi
      cpu: "1"

valkey:
  fullnameOverride: outline-valkey
  architecture: standalone
  replicaCount: 1
  # Password auth — delivered from Vault via VSO (outline-valkey-auth secret);
  # outline reads host/port/username/password and assembles the ioredis URL in
  # its entrypoint.
  auth:
    enabled: true
    existingSecret: outline-valkey-auth
    existingSecretPasswordKey: password
  # Plain TCP: the outline chart's entrypoint builds the ioredis connection
  # from host/port/username/password only, so it has no way to carry a CA or
  # switch the scheme to TLS.
  tls:
    enabled: false
  service:
    port: 6379
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

cnpg:
  fullnameOverride: outline-pg-cluster
  version:
    postgresql: "17"
  cluster:
    # Image resolved for the major above from the shared catalog (see the
    # cloudnative-pg app); bumping `version.postgresql` runs an in-place
    # pg_upgrade.
    imageCatalogRef:
      kind: ClusterImageCatalog
      name: postgresql-standard-trixie
    instances: 3
    enableSuperuserAccess: false
    initdb:
      database: outline
      owner: outline
    storage:
      size: 3Gi
    walStorage:
      enabled: true
      size: 3Gi
    postgresql:
      # Caps WAL retained by replication slots: a lagging/dead replica costs
      # a re-clone, not disk pressure on the primary.
      parameters:
        max_slot_wal_keep_size: 1GB
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    affinity:
      topologyKey: kubernetes.io/hostname
    monitoring:
      instrumentation:
        # The chart renders this queries ConfigMap but never wires it into
        # the Cluster, so it would only sit there unused.
        logicalReplication: false
  backups:
    enabled: false
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
    endpointURL: ""
    destinationPath: "s3://<bucket-name>/<bucket-prefix>"
    # VSO-managed (never inline keys here). The chart hardcodes the
    # ACCESS_KEY_ID / ACCESS_SECRET_KEY key names.
    secret:
      create: false
      name: outline-pg-cluster-backup
    # The chart has no S3 region setting; the barman sidecar picks it up
    # from the standard AWS env var instead.
    instanceSidecarConfiguration:
      env:
      - name: AWS_DEFAULT_REGION
        valueFrom:
          secretKeyRef:
            name: outline-pg-cluster-backup
            key: S3_REGION
    # Chart default requests AES256 server-side encryption, which not every
    # S3-compatible store implements — defer to the bucket's own default.
    wal:
      encryption: ""
    data:
      encryption: ""
    retentionPolicy: 30d
    scheduledBackups:
    - name: daily
      schedule: "0 0 0 * * *"
      backupOwnerReference: self
      method: plugin
      pluginConfiguration:
        name: barman-cloud.cloudnative-pg.io

vso:
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
  vaultAuth:
    default:
      method: kubernetes
      mount: kubernetes
      kubernetes:
        role: outline
        serviceAccount: vso
  vaultConnection:
    default:
      address: "https://vault.vault-operator-system.svc.cluster.local:8200"
      skipTLSVerify: false
      caCertSecretRef: vault-ca
  vaultStaticSecrets:
    outlineConfig:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-config
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            SECRET_KEY:
              text: '{{ get .Secrets "app" | dig "secretKey" "" }}'
            UTILS_SECRET:
              text: '{{ get .Secrets "app" | dig "utilsSecret" "" }}'
    outlineS3:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-s3
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            S3_ACCESS_KEY:
              text: '{{ get .Secrets "s3" | dig "accessKey" "" }}'
            S3_SECRET_KEY:
              text: '{{ get .Secrets "s3" | dig "secretKey" "" }}'
    outlineValkeyAuth:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-valkey-auth
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            # Valkey has no ACL users configured, so outline authenticates as
            # the built-in `default` user with the requirepass secret.
            username:
              text: default
            password:
              text: '{{ get .Secrets "valkey" | dig "password" "" }}'
    outlineDbAdmin:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-pg-cluster-admin
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "admin" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "admin" "password" "" }}'
    outlineDbApp:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-pg-cluster-app
        create: true
        type: kubernetes.io/basic-auth
        transformation:
          excludes:
          - ".*"
          templates:
            username:
              text: '{{ get .Secrets "postgres" | dig "app" "username" "" }}'
            password:
              text: '{{ get .Secrets "postgres" | dig "app" "password" "" }}'
    outlinePgBackup:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-pg-cluster-backup
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            S3_ENDPOINT:
              text: '{{ get .Secrets "postgres" | dig "s3" "endpoint" "" }}'
            S3_BUCKET_NAME:
              text: '{{ get .Secrets "postgres" | dig "s3" "bucketName" "" }}'
            S3_BUCKET_PREFIX:
              text: '{{ get .Secrets "postgres" | dig "s3" "bucketPrefix" "" }}'
            ACCESS_KEY_ID:
              text: '{{ get .Secrets "postgres" | dig "s3" "accessKey" "" }}'
            ACCESS_SECRET_KEY:
              text: '{{ get .Secrets "postgres" | dig "s3" "secretKey" "" }}'
            S3_REGION:
              text: '{{ get .Secrets "postgres" | dig "s3" "region" "" }}'
    outlineSso:
      mount: ""
      path: ""
      type: kv-v2
      vaultAuthRef: outline-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: outline-sso
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            OIDC_CLIENT_ID:
              text: '{{ get .Secrets "keycloak" | dig "clientId" "" }}'
            OIDC_CLIENT_SECRET:
              text: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'
