{{- if .Values.gateway.enabled }}
---
# Gateway API ExtensionRef Middleware refs are same-namespace only
# (LocalObjectReference — no namespace field in the Gateway API type), so
# this can't just reference the traefik app's own lan-only Middleware —
# every namespace that needs it gets its own copy. Keep lanOnly.sourceRange
# in sync across the apps that render this (traefik, cilium, longhorn).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: {{ .Release.Namespace }}
spec:
  ipAllowList:
    sourceRange:
    {{- toYaml .Values.lanOnly.sourceRange | nindent 4 }}
{{- end }}
