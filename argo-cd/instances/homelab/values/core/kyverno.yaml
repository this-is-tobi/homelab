kyverno: {}

# HIGHEST-STAKES NAMESPACE IN THE ENTIRE ZERO-TRUST DESIGN. Webhook is
# fail-closed (validate.kyverno.svc-fail, failurePolicy: Fail) — if this
# Service loses all healthy endpoints, ALL POD ADMISSION CLUSTER-WIDE
# STALLS. This NetworkPolicy is safe to roll back independently: no
# kyverno ClusterPolicy/PolicyException targets kind NetworkPolicy at any
# level, so even a fully broken kyverno webhook would not block deleting
# or reverting it. Roll out LAST, after every other namespace, with
# `kubectl kyverno apply <policy> --resource <this-networkpolicy.yaml>`
# dry-run validation first. The webhook-ingress ipBlock (10.45.0.0/16,
# the pod CIDR, not the node subnet) matters MOST here of anywhere in the
# design: with no webhook pod pinned to a control-plane node, the wrong
# ipBlock would only work when a pod happened to land on the same node
# as the apiserver instance handling a given call.
networkPolicy:
  enabled: true
  egressDeny: true
  extraIngress:
  # background-controller and reports-controller are DELIBERATELY
  # EXCLUDED — no webhook Service targets them and neither pod defines
  # any probes.
  - name: apiserver-webhook
    podSelector:
      matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [admission-controller, cleanup-controller] }
    rules:
    - from:
      - ipBlock: { cidr: 10.45.0.0/16 }
      ports:
      - { protocol: TCP, port: 9443 }
  extraEgress:
  - name: apiserver
    rules:
    - to:
      - ipBlock: { cidr: 192.168.1.0/24 }
      ports:
      - { protocol: TCP, port: 6443 }
