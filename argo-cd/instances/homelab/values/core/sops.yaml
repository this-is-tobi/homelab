sops: {}

vso:
  vaultStaticSecrets:
    sopsAgeKeyFile:
      mount: homelab
      path: platforms/production/core/sops

# Zero-trust NetworkPolicy: default-deny with explicit allow rules for
# only the traffic this namespace needs. No webhook targets this
# namespace. No network KMS (gcp/gpg/azure all disabled) — the age
# decryption key is delivered as a local file by VSO, so decryption is
# entirely local, no external calls needed.
networkPolicy:
  enabled: true
  egressDeny: true
  prometheusScrapePorts:
  - { protocol: TCP, port: 8080 }
  extraIngress: []
  extraEgress:
  # -leader-elect + cluster-wide watch (namespaced: false).
  - name: apiserver
    rules:
    - to:
      - ipBlock: { cidr: 192.168.1.0/24 }
      ports:
      - { protocol: TCP, port: 6443 }
