# The ohmlab controller on the `homelab` instance
# (https://github.com/this-is-tobi/ohmlab/blob/main/docs/08-controller.md).

targets:
  vault:
    enabled: true
  # Gitea and the oauth2-proxies read their certificate only when they start:
  # roll them each time cert-manager issues it again.
  certificates:
    enabled: true
    restarts:
    - namespace: gitea
      certificate: gitea-tls
      workloads:
      - { kind: Deployment, name: gitea }
    - namespace: kube-system
      certificate: hubble-oauth2-proxy-tls
      workloads:
      - { kind: Deployment, name: hubble-oauth2-proxy }
    - namespace: longhorn-system
      certificate: longhorn-oauth2-proxy-tls
      workloads:
      - { kind: Deployment, name: longhorn-oauth2-proxy }

# Zero-trust NetworkPolicy for this namespace: the API server, and Vault for
# the vault target, plus DNS (added by the chart); Prometheus scrapes the
# metrics port.
networkPolicy:
  enabled: true
  prometheusScrapePorts:
  - { protocol: TCP, port: 8080 }
  extraEgress:
  - name: apiserver
    rules:
    - to:
      - ipBlock: { cidr: 192.168.1.0/24 }
      ports:
      - { protocol: TCP, port: 6443 }
  # The vault target's pods only.
  - name: vault
    podSelector:
      matchLabels:
        app.kubernetes.io/component: vault
    rules:
    - to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: vault-operator-system
        podSelector:
          matchLabels:
            app.kubernetes.io/name: vault
      ports:
      - { protocol: TCP, port: 8200 }
