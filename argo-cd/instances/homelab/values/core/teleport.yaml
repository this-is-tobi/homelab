gateway:
  enabled: true
  gatewayName: homelab-gateway-traefik
  gatewayNamespace: kube-system
  tlsRoutes:
  - name: teleport
    listener: tls-teleport-apex
    hostnames:
    - teleport.core.ohmlab.fr
    backendService: teleport
    backendPort: 443
  - name: teleport-wildcard
    listener: tls-teleport
    hostnames:
    - "*.teleport.core.ohmlab.fr"
    backendService: teleport
    backendPort: 443

server:
  clusterName: teleport.core.ohmlab.fr

roles: {}

users:
  tobi:
    roles:
    - superadmin
    - admin
  qit:
    roles:
    - admin

# Zero-trust NetworkPolicy: default-deny with explicit allow rules for
# only the traffic this namespace needs. No SSO (local auth only, no
# connector config). No prometheus scrape (no ServiceMonitor/PodMonitor
# exists for this app).
networkPolicy:
  enabled: true
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress:
  # TLS PASSTHROUGH (traefik terminates nothing) — genuine pod-to-pod flow
  # from traefik's own pod identity, not a node hairpin. Port is the
  # CONTAINER port (3080, "tls"), not the Service's front-facing 443 — the
  # Service targetPort maps 443->3080 and NetworkPolicy matches the pod-
  # level connection, not the Service port.
  - name: traefik
    podSelector:
      matchLabels: { app.kubernetes.io/component: proxy, app.kubernetes.io/instance: teleport, app.kubernetes.io/name: server }
    rules:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik
      ports:
      - { protocol: TCP, port: 3080 }
  extraEgress:
  # auth: impersonates users/groups/serviceaccounts (Kubernetes Access) +
  # TokenReview (system:auth-delegator) for join-token validation.
  # operator: client-go reconcile loop against ~28 teleport.dev CRD kinds.
  # proxy EXCLUDED — it holds zero RBAC bindings for its ServiceAccount.
  - name: apiserver
    podSelector:
      matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [auth, operator] }
    rules:
    - to:
      - ipBlock: { cidr: 192.168.1.0/24 }
      ports:
      - { protocol: TCP, port: 6443 }
  # Deliberately NOT included: Teleport's own best-effort Cloud usage-
  # reporting beacon — no repo toggle exists to disable it; blocking by
  # default matches a reasonable homelab privacy posture, self-hosted auth
  # is documented as not degrading if this specific call fails.
