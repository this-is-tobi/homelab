gateway:
  enabled: true
  gatewayName: homelab-gateway-traefik
  gatewayNamespace: kube-system
  routes:
  - name: keycloak
    hostnames:
    - sso.core.ohmlab.fr
    rules:
    - backendService: keycloak
      backendPort: 8080

keycloak:
  keycloak:
    hostnameAdmin: "https://sso.core.ohmlab.fr"
    hostname: "https://sso.core.ohmlab.fr"
    existingSecret: keycloak-admin
    secretKeys:
      adminPasswordKey: password
  database:
    host: keycloak-pg-cluster-rw
    port: "5432"
    name: keycloak
    existingSecret: keycloak-pg-cluster-app
    secretKeys:
      usernameKey: username
      passwordKey: password

cnpg:
  mode: primary
  credentials:
    existingSecrets:
      enabled: true
      postgres:
        secretName: keycloak-pg-cluster-admin
      app:
        secretName: keycloak-pg-cluster-app
  backup:
    enabled: false  # S3 keys not configured yet — re-enable when available
    endpointURL: "https://s3.fr-par.scw.cloud"
    destinationPath: "s3://ohmlab-backups/cnpg"
    s3Credentials:
      create: false
      secretName: keycloak-pg-cluster-backup
      accessKeyId:
        key: S3_ACCESS_KEY
      secretAccessKey:
        key: S3_SECRET_KEY
      region:
        key: S3_REGION

vso:
  vaultStaticSecrets:
    keycloakAdmin:
      mount: homelab
      path: platforms/production/core/keycloak
    keycloakConfig:
      mount: homelab
      path: platforms/production/core/keycloak
    keycloakDbInfos:
      mount: homelab
      path: platforms/production/core/keycloak
    keycloakDbAdmin:
      mount: homelab
      path: platforms/production/core/keycloak
    keycloakDbApp:
      mount: homelab
      path: platforms/production/core/keycloak
    keycloakPgBackup:
      mount: homelab
      path: platforms/production/core/keycloak
    clientGitea:
      mount: homelab
      path: platforms/production/core/keycloak
    clientGrafanaCore:
      mount: homelab
      path: platforms/production/core/keycloak
    clientArgoCd:
      mount: homelab
      path: platforms/production/core/keycloak
    clientArgoCdCore:
      mount: homelab
      path: platforms/production/core/keycloak
    clientVaultCore:
      mount: homelab
      path: platforms/production/core/keycloak
    clientLonghornCore:
      mount: homelab
      path: platforms/production/core/keycloak
    clientHubbleCore:
      mount: homelab
      path: platforms/production/core/keycloak
    clientRustfs:
      mount: homelab
      path: platforms/production/core/keycloak

# Zero-trust NetworkPolicy: default-deny with explicit allow rules for
# only the traffic this namespace needs. Deliberately NO SSO-hairpin
# egress rule here: keycloak's --hostname flags only construct URLs
# RETURNED to browsers (issuer, redirects) — it never dials its own
# public hostname. No federated external IdP, no SMTP, and no
# backchannel-logout configured on any client, so none of those need an
# egress rule either.
networkPolicy:
  enabled: true
  egressDeny: true
  prometheusScrapePorts:
  - { protocol: TCP, port: 9000 }   # keycloak itself, http-metrics
  - { protocol: TCP, port: 9187 }   # CNPG postgres-exporter
  extraIngress:
  - name: traefik
    podSelector:
      matchLabels: { app.kubernetes.io/name: keycloak }
    rules:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik
      ports:
      - { protocol: TCP, port: 8080 }
  - name: cnpg-operator
    podSelector:
      matchLabels: { cnpg.io/cluster: keycloak-pg-cluster }
    rules:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: cloudnative-pg
        podSelector:
          matchLabels: { app.kubernetes.io/name: cloudnative-pg }
      ports:
      - { protocol: TCP, port: 8000 }
      - { protocol: TCP, port: 5432 }
  extraEgress:
  # CNPG instance pods ONLY — the keycloak app pod itself has
  # automountServiceAccountToken: false + SA "default" (no RoleBinding),
  # architecturally incapable of apiserver access even if it wanted to.
  - name: apiserver
    podSelector:
      matchLabels: { cnpg.io/cluster: keycloak-pg-cluster }
    rules:
    - to:
      - ipBlock: { cidr: 192.168.1.0/24 }
      ports:
      - { protocol: TCP, port: 6443 }
