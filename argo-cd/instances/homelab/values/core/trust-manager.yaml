# Zero-trust NetworkPolicy: default-deny with explicit allow rules for only
# the traffic trust-manager needs.
networkPolicy:
  enabled: true
  extraIngress:
  # The Bundle validating webhook (failurePolicy Fail) is called by the
  # apiserver; the pod-CIDR ipBlock matches how that call arrives.
  - name: webhook
    rules:
    - from:
      - ipBlock: { cidr: 10.45.0.0/16 }
      ports:
      - { protocol: TCP, port: 6443 }
  extraEgress:
  - name: apiserver
    rules:
    - to:
      - ipBlock: { cidr: 192.168.1.0/24 }
      ports:
      - { protocol: TCP, port: 6443 }

# The internal CA's root as the ConfigMap ohmlab-internal-ca (key ca.crt) in
# trust-manager's target namespaces, for the clients of in-cluster TLS.
internalCaBundle:
  enabled: true
