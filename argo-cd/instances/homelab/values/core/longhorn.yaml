gateway:
  enabled: true
  gatewayName: homelab-gateway-traefik
  gatewayNamespace: kube-system
  routes:
  - name: longhorn
    listener: https-wildcard-int
    hostnames:
    - longhorn.int.ohmlab.fr
    rules:
    - backendService: longhorn-oauth2-proxy
      backendPort: 80
      # LAN-only; oauth2-proxy stays on as a second factor — this narrows
      # WHERE the login page is even reachable from, it doesn't replace
      # auth.
      filters:
      - type: ExtensionRef
        extensionRef:
          group: traefik.io
          kind: Middleware
          name: lan-only

# Must stay in sync with the traefik and cilium apps' own lanOnly values
# (each namespace renders its own copy of this Middleware).
lanOnly:
  sourceRange:
  - 192.168.1.0/24
  - 10.45.0.0/16 # cilium pod CIDR

vso:
  vaultStaticSecrets:
    longhornSso:
      mount: homelab
      path: platforms/production/core/longhorn
      type: kv-v2
      vaultAuthRef: longhorn-system-vso-default
      refreshAfter: 1h
      hmacSecretData: true
      destination:
        name: longhorn-oauth2-proxy-creds
        create: true
        type: Opaque
        transformation:
          excludes:
          - ".*"
          templates:
            client-id:
              text: '{{ get .Secrets "keycloak" | dig "clientId" "" }}'
            client-secret:
              text: '{{ get .Secrets "keycloak" | dig "clientSecret" "" }}'
            cookie-secret:
              text: '{{ get .Secrets "keycloak" | dig "cookieSecret" "" }}'
  extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: vso
      namespace: longhorn-system

sso:
  config:
    configFile: |-
      provider = "keycloak-oidc"
      provider_display_name = "Keycloak"
      email_domains = [ "*" ]
      upstreams = [ "http://longhorn-frontend.longhorn-system.svc.cluster.local:80/" ]
      redirect_url = "https://longhorn.int.ohmlab.fr/oauth2/callback"
      oidc_issuer_url = "https://sso.core.ohmlab.fr/realms/homelab"
      reverse_proxy = true
      cookie_secure = true
      cookie_domains = [ "longhorn.int.ohmlab.fr" ]

# Volume data protection. Snapshots are LOCAL (copy-on-write on the same
# disks) and need no S3 — they protect against app-level mistakes, not disk
# loss. Off-cluster backups additionally need defaultSettings.backupTarget +
# the longhorn-s3 credential secret (see below), same S3 bucket as CNPG.
backups:
  recurringJobs:
  # Applies to every volume without an explicit recurring-job group.
  - name: snapshot-daily
    task: snapshot
    cron: "0 3 * * *"
    retain: 7
  # Uncomment together with backupTarget + the longhorn-s3 secret:
  # - name: backup-weekly
  #   task: backup
  #   cron: "0 4 * * 0"
  #   retain: 4

longhorn:
  ingress:
    enabled: false
  # Off-cluster backup destination — uncomment when the S3 keys exist (same
  # blocker as the CNPG `backup.enabled` flags): create the `longhorn-s3`
  # secret in longhorn-system with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
  # / AWS_ENDPOINTS=https://s3.fr-par.scw.cloud (via a VSO vaultStaticSecret
  # like longhornSso above), then:
  # defaultSettings:
  #   backupTarget: "s3://ohmlab-backups@fr-par/longhorn"
  # ⚠ networkPolicy below is egress-deny: also uncomment the s3-backup
  # extraEgress rule so instance-managers can reach the S3 endpoint.

# Zero-trust NetworkPolicy: default-deny with explicit allow rules for
# only the traffic this namespace needs. iSCSI/NFS rules below use the
# same pod-CIDR ipBlock as the webhook rule, by structural analogy (a
# remote node's host-namespace process reaching a pod) — verify with a
# live volume attach/detach test if this namespace's traffic pattern
# ever changes.
networkPolicy:
  enabled: true
  egressDeny: true
  prometheusScrapePorts:
  - { protocol: TCP, port: 9500 }   # longhorn-manager, SM port "manager"
  extraIngress:
  - name: webhook
    podSelector:
      matchLabels: { app: longhorn-manager }
    rules:
    - from:
      - ipBlock: { cidr: 10.45.0.0/16 }
      ports:
      - { protocol: TCP, port: 9502 }
  - name: iscsi
    podSelector:
      matchLabels: { longhorn.io/component: instance-manager }
    rules:
    - from:
      - ipBlock: { cidr: 10.45.0.0/16 }
      ports:
      - { protocol: TCP, port: 3260 }
  - name: nfs
    podSelector:
      matchLabels: { longhorn.io/component: share-manager }
    rules:
    - from:
      - ipBlock: { cidr: 10.45.0.0/16 }
      ports:
      - { protocol: TCP, port: 2049 }
  - name: sso
    podSelector:
      matchLabels: { app.kubernetes.io/name: sso, app.kubernetes.io/instance: longhorn-system }
    rules:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik
      ports:
      - { protocol: TCP, port: 4180 }
  extraEgress:
  - name: apiserver
    rules:
    - to:
      - ipBlock: { cidr: 192.168.1.0/24 }
      ports:
      - { protocol: TCP, port: 6443 }
  # Uncomment together with defaultSettings.backupTarget (S3 backups).
  # - name: s3-backup
  #   rules:
  #   - to:
  #     - ipBlock: { cidr: 0.0.0.0/0, except: [10.45.0.0/16, 192.168.1.0/24] }
  #     ports:
  #     - { protocol: TCP, port: 443 }
  - name: sso-hairpin
    podSelector:
      matchLabels: { app.kubernetes.io/name: sso, app.kubernetes.io/instance: longhorn-system }
    rules:
    - to:
      - ipBlock: { cidr: 82.66.77.140/32 }
      ports:
      - { protocol: TCP, port: 443 }
