arc-controller: {}

# Runner scale sets, keyed by the dependency aliases of the chart. Their mode,
# runner image and pod settings come from the chart.
runner-group-001:
  runnerScaleSetName: tools
  githubConfigUrl: https://github.com/this-is-tobi/tools
  minRunners: 1
  maxRunners: 4
  labels:
    github-repo: tools
  controllerServiceAccount:
    namespace: actions-runner-controller
    name: actions-runner-controller-sa

runner-group-002:
  runnerScaleSetName: multiarch-mirror
  githubConfigUrl: https://github.com/this-is-tobi/multiarch-mirror
  minRunners: 1
  maxRunners: 4
  labels:
    github-repo: multiarch-mirror
  controllerServiceAccount:
    namespace: actions-runner-controller
    name: actions-runner-controller-sa
