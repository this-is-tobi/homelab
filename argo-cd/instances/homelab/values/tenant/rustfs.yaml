gateway:
  enabled: true
  gatewayName: homelab-gateway-traefik
  gatewayNamespace: kube-system
  routes:
  - name: rustfs
    listener: https-wildcard-s3
    hostnames:
    - console.s3.ohmlab.fr
    rules:
    - backendService: rustfs-svc
      backendPort: 9001
  - name: rustfs-api
    hostnames:
    - s3.ohmlab.fr
    rules:
    - backendService: rustfs-svc
      backendPort: 9000

rustfs:
  # Exposed via Gateway API HTTPRoutes (gateway.routes) — no Ingress.
  ingress:
    enabled: false
  extraEnv:
  # Lists replace on merge, so this list drops the app-level rustfs.extraEnv
  # entirely. These two repeat it verbatim to keep log cleanup working;
  # keep them identical to argo-cd/apps/rustfs/values.yaml.
  - name: RUSTFS_OBS_LOG_COMPRESS_OLD_FILES
    value: "false"
  - name: RUSTFS_OBS_LOG_MAX_TOTAL_SIZE_BYTES
    value: "536870912"
  # Keycloak SSO for the console. RustFS discovers the provider once at
  # startup and drops it (no retry) if Keycloak is unreachable then, so a
  # missing login button means: check the sso-hairpin egress rule below,
  # then restart the pod.
  #
  # Pins the callback and post-login redirects to the public console
  # origin instead of trusting Host/X-Forwarded-* from the proxy.
  - name: RUSTFS_BROWSER_REDIRECT_URL
    value: "https://console.s3.ohmlab.fr"
  - name: RUSTFS_IDENTITY_OPENID_ENABLE
    value: "on"
  - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL
    value: "https://sso.core.ohmlab.fr/realms/homelab/.well-known/openid-configuration"
  - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID
    value: "rustfs"
  - name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: rustfs-oidc
        key: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET
  # Must match the redirect URI registered on the Keycloak "rustfs" client.
  - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI
    value: "https://console.s3.ohmlab.fr/rustfs/admin/v3/oidc/callback/default"
  - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC
    value: "off"
  - name: RUSTFS_IDENTITY_OPENID_SCOPES
    value: "openid,profile,email"
  # Claim values are used verbatim as RustFS policy names, and Keycloak's
  # shared "groups" claim carries full paths ("/admin") that can never
  # match one. The rustfs client emits a dedicated flat "rustfs_policy"
  # claim from its client roles instead; pointing both claim settings at
  # it keeps the "groups" claim out of policy mapping entirely. A login
  # without that claim maps to no policy and is denied.
  - name: RUSTFS_IDENTITY_OPENID_CLAIM_NAME
    value: "rustfs_policy"
  - name: RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM
    value: "rustfs_policy"
  - name: RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM
    value: "preferred_username"
  - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME
    value: "Keycloak"

vso:
  vaultStaticSecrets:
    rustfsAdmin:
      mount: homelab
      path: platforms/production/tenant/rustfs
    rustfsOidc:
      mount: homelab
      path: platforms/production/tenant/rustfs

# Zero-trust NetworkPolicy: default-deny with explicit allow rules for
# only the traffic this namespace needs. No apiserver/CNPG egress:
# standalone S3 storage, no database.
networkPolicy:
  enabled: true
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress:
  - name: traefik
    rules:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik
      ports:
      - { protocol: TCP, port: 9000 }
      - { protocol: TCP, port: 9001 }
  extraEgress:
  # Console OIDC (discovery, JWKS, token exchange) dials sso.core.ohmlab.fr
  # directly. The hairpin goes to the gateway's public IP, not a node IP;
  # https only.
  - name: sso-hairpin
    podSelector:
      matchLabels: { app.kubernetes.io/instance: rustfs, app.kubernetes.io/name: rustfs }
    rules:
    - to:
      - ipBlock: { cidr: 82.66.77.140/32 }
      ports:
      - { protocol: TCP, port: 443 }
