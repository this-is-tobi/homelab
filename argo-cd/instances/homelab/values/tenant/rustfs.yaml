gateway:
  enabled: true
  gatewayName: homelab-gateway-traefik
  gatewayNamespace: kube-system
  routes:
  - name: rustfs
    listener: https-wildcard-s3
    hostnames:
    - console.s3.ohmlab.fr
    rules:
    - backendService: rustfs-svc
      backendPort: 9001
  - name: rustfs-api
    hostnames:
    - s3.ohmlab.fr
    rules:
    - backendService: rustfs-svc
      backendPort: 9000

rustfs:
  # Exposed via Gateway API HTTPRoutes (gateway.routes) — no Ingress.
  ingress:
    enabled: false

apiIngress:
  enabled: false
  storageclass:
    dataStorageSize: 500Gi
  config:
    rustfs:
      region: eu-west-1
  extraEnv:
  - name: RUSTFS_IDENTITY_OPENID_ENABLE
    value: "on"
  - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL
    value: "https://sso.core.ohmlab.fr/realms/homelab/.well-known/openid-configuration"
  - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID
    value: "rustfs"
  - name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: rustfs-oidc
        key: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET
  - name: RUSTFS_IDENTITY_OPENID_SCOPES
    value: "openid,profile,email,groups"
  - name: RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM
    value: "groups"
  - name: RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM
    value: "preferred_username"
  - name: RUSTFS_IDENTITY_OPENID_ROLE_POLICY
    value: "consoleAdmin"
  - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME
    value: "Keycloak"

vso:
  vaultStaticSecrets:
    rustfsAdmin:
      mount: homelab
      path: platforms/production/tenant/rustfs
    rustfsOidc:
      mount: homelab
      path: platforms/production/tenant/rustfs

# Zero-trust NetworkPolicy. See .local/post-migration-hardening.md §2 for
# the 5 empirically-tested facts this design depends on. No apiserver/SSO/
# CNPG egress — standalone S3 storage, no database, no auth integration of
# its own (the RUSTFS_IDENTITY_OPENID_* config is app-internal, not a
# reason for pod egress since apiIngress.enabled is false and nothing else
# reads it — confirmed dead config, see the gitea/rustfs investigation
# notes). Backups not wired yet (§4 backup gap).
networkPolicy:
  enabled: false
  egressDeny: true
  prometheusScrapePorts: []
  extraIngress:
  - name: traefik
    rules:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik
      ports:
      - { protocol: TCP, port: 9000 }
      - { protocol: TCP, port: 9001 }
  extraEgress: []
