# `homelab` instance — personal, all-in-one production cluster.
# Schema reference + full documentation:
# https://github.com/this-is-tobi/ohmlab/blob/main/argo-cd/instances/_example/instance.yaml

instance:
  name: homelab
  env: production
  provider: self-hosted
  region: fr-par

destination:
  server: https://kubernetes.default.svc

# The instance repository: this file, core.yaml, tenant.yaml and the values.
repoURL: https://github.com/this-is-tobi/homelab.git
valuesRepoURL: ""
targetRevision: main

# Where the charts come from (`catalog:` in core.yaml / tenant.yaml). The
# AppProjects must allow the same strings (values/core/ohmlab.yaml).
catalogs:
  # The published bootstrap chart, pinned in core.yaml.
  ohmlab: ghcr.io/this-is-tobi/charts
  # Every other chart: argo-cd/apps of the ohmlab repository.
  ohmlabCatalog:
    repoURL: https://github.com/this-is-tobi/ohmlab.git
    version: main
defaultCatalog: ohmlabCatalog

projects:
  core: admin-core
  tenant: admin-tenant

# Object storage (https://github.com/this-is-tobi/ohmlab/blob/main/docs/10-object-storage.md),
# rolled out in three steps: the records first, with wireConsumers off and the
# controller's storage target observe-only, then live, then the consumers.
storage:
  stores:
    rustfs-backups:
      type: rustfs
      app: rustfs-backups
      namespace: rustfs-backups
      endpoint: https://rustfs-svc.rustfs-backups.svc:9000
      region: us-east-1
      size: 50Gi
      storageClass: longhorn-two-replicas
  backups: rustfs-backups
  wireConsumers: false
  # Every app namespace here denies by default: the claims' policies widen theirs.
  networkPolicies: true
