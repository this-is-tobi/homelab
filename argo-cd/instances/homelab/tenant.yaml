# Tenant (apps) tier app catalog for the `homelab` instance.
# Slim list — only what is actually deployed.
# Schema reference:
# https://github.com/this-is-tobi/ohmlab/blob/main/argo-cd/instances/_example/tenant.yaml

apps:
- app: argo-cd
  enabled: "true"
  namespace: argo-cd
  syncWave: 100
  ignoreDifferences:
  # argocd-secret contains a randomly-generated server.secretkey at first install
  # plus admin.password set at runtime — must not be overwritten on re-sync.
  - group: ""
    kind: Secret
    name: argocd-secret
    jqPathExpressions:
    - .data
- app: actions-runner-controller
  enabled: "false" # Off until its runners are tested on this cluster
  syncWave: 110
- app: gitea
  enabled: "true"
  syncWave: 110
- app: mattermost
  enabled: "true"
  syncWave: 110
  ignoreDifferences:
  # The mattermost chart always renders mattermost-mattermost-dbsecret with an
  # empty URL ("postgres://"), and VSO writes the real one into it. Argo CD
  # leaves VSO the data and every field VSO manages (the labels it sets at
  # each refresh), or self-heal and VSO rewrite each other.
  - group: ""
    kind: Secret
    name: mattermost-mattermost-dbsecret
    jqPathExpressions:
    - .data
    managedFieldsManagers:
    - vault-secrets-operator
- app: rustfs
  enabled: "true"
  syncWave: 110
- app: homepage
  enabled: "true"
  syncWave: 200
