harbor:
  harborAdminPassword: ""
  externalURL: "https://harbor.example.com"
  expose:
    tls:
      secret:
        secretName: ""
    ingress:
      hosts:
        core: harbor.example.com
  database:
    external:
      host: harbor-pg-cluster-rw
      port: 5432
      coreDatabase: harbor
      username: harbor
      password: ""

cnpg:
  # Operator-generated credentials by default; to bootstrap from
  # pre-existing (e.g. VSO-managed) secrets instead:
  # cluster:
  #   superuserSecret: harbor-pg-cluster-admin
  #   initdb:
  #     secret:
  #       name: harbor-pg-cluster-app
  backups:
    enabled: false
    endpointURL: "https://s3.example.com"
    destinationPath: "s3://backups/cnpg"

vso:
  vaultStaticSecrets:
    harborAdmin:
      mount: homelab
      path: platforms/production/tenant/harbor
    harborSecretkey:
      mount: homelab
      path: platforms/production/tenant/harbor
    harborS3:
      mount: homelab
      path: platforms/production/tenant/harbor
    harborDbInfos:
      mount: homelab
      path: platforms/production/tenant/harbor
    harborDbAdmin:
      mount: homelab
      path: platforms/production/tenant/harbor
    harborDbApp:
      mount: homelab
      path: platforms/production/tenant/harbor
    harborPgBackup:
      mount: homelab
      path: platforms/production/tenant/harbor
    harborSso:
      mount: homelab
      path: platforms/production/tenant/harbor
