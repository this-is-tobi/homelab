coder:
  coder:
    ingress:
      host: coder.example.com
      wildcardHost: "*.coder.example.com"
      tls:
        secretName: coder.example.com-tls
        wildcardSecretName: coder.example.com-tls-wild
    envUseClusterAccessURL: false
    env:
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-pg-cluster-infos
          key: CONNECTION_STRING
    - name: CODER_ACCESS_URL
      value: "https://coder.example.com"
    - name: CODER_OIDC_ISSUER_URL
      value: "https://keycloak.example.com/realms/homelab"
    - name: CODER_OIDC_CLIENT_ID
      value: coder
    - name: CODER_OIDC_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: coder-sso
          key: OIDC_CLIENT_SECRET
    - name: CODER_OIDC_SIGN_IN_TEXT
      value: Login with Keycloak
    - name: CODER_OIDC_SCOPES
      value: "openid,profile,email,groups,roles"
    - name: CODER_OIDC_GROUP_FIELD
      value: groups
    - name: CODER_OIDC_ADMIN_GROUP
      value: admin
    - name: CODER_OIDC_GROUP_AUTO_CREATE
      value: "true"
    envFrom: []
    # - configMapRef:
    #     name: coder-config
    # - secretRef:
    #     name: coder-config
    # - secretRef:
    #     name: coder-sso

cnpg:
  cluster:
    superuserSecret: coder-pg-cluster-admin
    initdb:
      secret:
        name: coder-pg-cluster-app
  backups:
    enabled: true
    endpointURL: "https://s3.example.com"
    destinationPath: "s3://backups/cnpg"

vso:
  vaultStaticSecrets:
    coderDbInfos:
      mount: example
      path: platforms/production/tenant/coder
    coderDbAdmin:
      mount: example
      path: platforms/production/tenant/coder
    coderDbApp:
      mount: example
      path: platforms/production/tenant/coder
    coderPgBackup:
      mount: example
      path: platforms/production/tenant/coder
    coderSso:
      mount: example
      path: platforms/production/tenant/coder
