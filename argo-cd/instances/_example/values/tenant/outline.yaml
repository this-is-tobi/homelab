outline:
  url: "https://outline.example.com"
  ingress:
    hosts:
    - host: outline.example.com
      paths:
      - path: /
        pathType: Prefix
    tls:
    - hosts:
      - outline.example.com
      secretName: outline.example.com-tls
  fileStorage:
    s3:
      bucket: outline
      bucketUrl: "https://s3.example.com/outline"
      region: fr-par
  auth:
    oidc:
      authUri: "https://keycloak.example.com/realms/homelab/protocol/openid-connect/auth"
      tokenUri: "https://keycloak.example.com/realms/homelab/protocol/openid-connect/token"
      userInfoUri: "https://keycloak.example.com/realms/homelab/protocol/openid-connect/userinfo"

cnpg:
  cluster:
    superuserSecret: outline-pg-cluster-admin
    initdb:
      secret:
        name: outline-pg-cluster-app
  backups:
    enabled: true
    endpointURL: "https://s3.example.com"
    destinationPath: "s3://backups/cnpg"

vso:
  vaultStaticSecrets:
    outlineConfig:
      mount: example
      path: platforms/production/tenant/outline
    outlineS3:
      mount: example
      path: platforms/production/tenant/outline
    outlineValkeyAuth:
      mount: example
      path: platforms/production/tenant/outline
    outlineDbAdmin:
      mount: example
      path: platforms/production/tenant/outline
    outlineDbApp:
      mount: example
      path: platforms/production/tenant/outline
    outlinePgBackup:
      mount: example
      path: platforms/production/tenant/outline
    outlineSso:
      mount: example
      path: platforms/production/tenant/outline
