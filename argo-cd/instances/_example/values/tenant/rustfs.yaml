# Exposed through Gateway API HTTPRoutes of the gateway app, no Ingress.
gateway:
  enabled: true
  gatewayName: example-gateway
  gatewayNamespace: kube-system
  routes:
  - name: rustfs
    hostnames:
    - console.s3.example.com
    rules:
    - backendService: rustfs-svc
      backendPort: 9001
  - name: rustfs-api
    hostnames:
    - s3.example.com
    rules:
    - backendService: rustfs-svc
      backendPort: 9000

rustfs:
  ingress:
    enabled: false
  dataPersistence:
    size: 250Gi

vso:
  vaultStaticSecrets:
    rustfsOidc:
      mount: homelab
      path: platforms/production/tenant/rustfs
    rustfsAdmin:
      mount: homelab
      path: platforms/production/tenant/rustfs
