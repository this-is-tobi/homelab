sonarqube:
  ingress:
    hosts:
    - name: sonarqube.example.com
      path: /
    tls:
    - hosts:
      - sonarqube.example.com
      secretName: sonarqube.example.com-tls
  jdbcOverwrite:
    jdbcUrl: "jdbc:postgresql://sonarqube-pg-cluster-rw:5432/sonarqube?socketTimeout=1500"
    jdbcUsername: sonarqube
  sonarProperties:
    sonar.core.serverBaseURL: "https://sonarqube.example.com"
    sonar.auth.oidc.issuerUri: "https://keycloak.example.com/realms/homelab"
    sonar.auth.oidc.clientId.secured: sonarqube
    sonar.auth.oidc.clientSecret.secured: ""

cnpg:
  cluster:
    superuserSecret: sonarqube-pg-cluster-admin
    initdb:
      secret:
        name: sonarqube-pg-cluster-app
  backups:
    enabled: true
    endpointURL: "https://s3.example.com"
    destinationPath: "s3://backups/cnpg"

vso:
  vaultStaticSecrets:
    sonarqubeAdmin:
      mount: example
      path: platforms/production/tenant/sonarqube
    sonarqubeProperties:
      mount: example
      path: platforms/production/tenant/sonarqube
    sonarqubeDbInfos:
      mount: example
      path: platforms/production/tenant/sonarqube
    sonarqubeDbAdmin:
      mount: example
      path: platforms/production/tenant/sonarqube
    sonarqubeDbApp:
      mount: example
      path: platforms/production/tenant/sonarqube
    sonarqubePgBackup:
      mount: example
      path: platforms/production/tenant/sonarqube
    sonarqubeSso:
      mount: example
      path: platforms/production/tenant/sonarqube
