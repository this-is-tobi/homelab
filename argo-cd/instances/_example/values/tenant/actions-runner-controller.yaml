arc-controller: {}

# Runner scale sets, keyed by the dependency aliases of the chart (runner-group-001 and runner-group-002).
runner-group-001:
  runnerScaleSetName: example-001
  # The repository, organization or enterprise the runners register to.
  githubConfigUrl: https://github.com/example/example-001
  minRunners: 1
  maxRunners: 4
  labels:
    github-repo: example-001
  controllerServiceAccount:
    namespace: actions-runner-controller
    name: actions-runner-controller-sa
  containerMode:
    type: dind # dind or kubernetes
    # the following is required when containerMode.type=kubernetes
    kubernetesModeWorkVolumeClaim:
      accessModes:
      - ReadWriteOnce
      storageClassName: ""
      resources:
        requests:
          storage: 5Gi
  template:
    spec:
      containers:
      - name: runner
        # Pin a version: the Kyverno policy refuses the latest tag.
        image: ghcr.io/actions/actions-runner:2.337.0
        command:
        - /home/runner/run.sh

runner-group-002:
  runnerScaleSetName: example-002
  # The repository, organization or enterprise the runners register to.
  githubConfigUrl: https://github.com/example/example-002
  minRunners: 1
  maxRunners: 4
  labels:
    github-repo: example-002
  controllerServiceAccount:
    namespace: actions-runner-controller
    name: actions-runner-controller-sa
  containerMode:
    type: dind # dind or kubernetes
    # the following is required when containerMode.type=kubernetes
    kubernetesModeWorkVolumeClaim:
      accessModes:
      - ReadWriteOnce
      storageClassName: ""
      resources:
        requests:
          storage: 5Gi
  template:
    spec:
      containers:
      - name: runner
        # Pin a version: the Kyverno policy refuses the latest tag.
        image: ghcr.io/actions/actions-runner:2.337.0
        command:
        - /home/runner/run.sh

vso:
  vaultStaticSecrets:
    githubApp:
      mount: homelab
      path: platforms/production/tenant/actions-runner-controller
