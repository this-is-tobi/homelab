keycloak:
  keycloak:
    hostnameAdmin: "https://keycloak.example.com"
    hostname: "https://keycloak.example.com"
  database:
    host: keycloak-pg-cluster-rw
    port: "5432"
    name: keycloak
    existingSecret: keycloak-pg-cluster-app
    secretKeys:
      usernameKey: username
      passwordKey: password
  ingress:
    hosts:
    - host: keycloak.example.com
      paths:
      - path: /
        pathType: Prefix
    tls:
    - secretName: keycloak.example.com-tls
      hosts:
      - keycloak.example.com

cnpg:
  cluster:
    superuserSecret: keycloak-pg-cluster-admin
    initdb:
      secret:
        name: keycloak-pg-cluster-app
  backups:
    enabled: true
    endpointURL: "https://s3.example.com"
    destinationPath: "s3://backups/cnpg"

vso:
  vaultStaticSecrets:
    clientArgoCdCore:
      mount: example
      path: platforms/production/core/keycloak
    clientVaultCore:
      mount: example
      path: platforms/production/core/keycloak
    clientLonghornCore:
      mount: example
      path: platforms/production/core/keycloak
    clientHubbleCore:
      mount: example
      path: platforms/production/core/keycloak
    clientRustfs:
      mount: example
      path: platforms/production/core/keycloak
    keycloakAdmin:
      mount: example
      path: platforms/production/core/keycloak
    keycloakConfig:
      mount: example
      path: platforms/production/core/keycloak
    keycloakDbInfos:
      mount: example
      path: platforms/production/core/keycloak
    keycloakDbAdmin:
      mount: example
      path: platforms/production/core/keycloak
    keycloakDbApp:
      mount: example
      path: platforms/production/core/keycloak
    keycloakPgBackup:
      mount: example
      path: platforms/production/core/keycloak
    clientGitea:
      mount: example
      path: platforms/production/tenant/gitea
    clientGrafanaCore:
      mount: example
      path: platforms/production/core/prometheus-stack
    clientArgoCd:
      mount: example
      path: platforms/production/tenant/argo-cd
