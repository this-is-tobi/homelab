# Vault (Bank-Vaults operator) and the Vault Secrets Operator.
#
# Set only what is yours here. The chart defaults already hold what every app
# of the catalog needs from Vault: the KV v2 mount `homelab`, one read-only
# policy per app (`homelab/data/platforms/+/+/<app>`) and one Kubernetes auth
# role per app, bound to the `vso` service account of the app's namespace.
# Do not copy those lists here: a list in an instance file replaces the chart's
# list as a whole, and every app missing from the copy then fails with
# `403 permission denied`. If you change a namespace in core.yaml or tenant.yaml,
# or want another mount name, override `vault.externalConfig.policies`,
# `.auth` and `.secrets` completely. CI (scripts/ci/check-vault-access.sh)
# checks that the role, the mount and the policy each chart asks for exist.

# Reach Vault through a Gateway API route; enable it once the gateway exists.
gateway:
  enabled: false
  gatewayName: example-gateway
  gatewayNamespace: kube-system
  # Vault serves TLS on 8200: the BackendTLSPolicy validates it against the
  # CA bundle that trust-manager publishes.
  backendTLS: true
  routes:
  - name: vault
    hostnames:
    - vault.example.com
    rules:
    - backendService: vault
      backendPort: 8200

# One replica on any node, with the default storage class. Use size 3 (raft
# needs an odd number) once the cluster has three nodes that can hold it, and
# pin the pods with `nodeSelector` if some nodes must stay free of it.
vault:
  size: 1
  nodeSelector: null
  storage:
    raft:
      storageClass: ""
  externalConfig:
    # Remote clusters that pull their secrets from this Vault, see
    # docs/05-services.md ("Multi-cluster (spoke clusters)").
    spokeClusters: []

# The secrets the ohmlab post-config job writes to Vault, one entry per path an
# enabled app reads (the keys each app expects are in the homelab instance:
# argo-cd/instances/homelab/values/core/vault-operator.yaml). Generated values
# are templated (`<random:24>`, `<age:secret>`, `<ref:path#key>`), credentials
# that cannot be generated are empty placeholders to set by hand in Vault.
ohmlab:
  vault:
    secrets: []
    # - path: homelab/platforms/production/tenant/actions-runner-controller
    #   data:
    #     githubApp:
    #       id: ""
    #       installationId: ""
    #       privateKey: ""
