gateway:
  enabled: false
  name: example-gateway
  domain: example.com
  clusterIssuer: letsencrypt-http-prod
  dnsClusterIssuer: letsencrypt-dns-prod
  wildcardTlsSecret: gateway-wildcard-tls
  apexTlsSecret: gateway-wildcard-tls
  extraListeners: []
  tlsPassthroughListeners: []

# Vault Secrets Operator: the KV mount and path are placeholders, set your own.
vso:
  vaultStaticSecrets:
    hubbleSso:
      mount: example
      path: platforms/production/core/cilium
