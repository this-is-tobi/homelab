gateway:
  enabled: false
  name: example-gateway
  domain: example.com
  clusterIssuer: letsencrypt-http-prod
  dnsClusterIssuer: letsencrypt-dns-prod
  wildcardTlsSecret: gateway-wildcard-tls
  apexTlsSecret: gateway-wildcard-tls
  extraListeners: []
  tlsPassthroughListeners: []

# Vault Secrets Operator: the KV mount is the one the vault-operator chart creates, the path is
# the app's own under platforms/<environment>/<tier>/<app>.
vso:
  vaultStaticSecrets:
    hubbleSso:
      mount: homelab
      path: platforms/production/core/hubble
