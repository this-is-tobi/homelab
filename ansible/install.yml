---
# All
- name: OS Upgrade
  hosts: all
  become: true
  vars_files:
    - ./inventory/group_vars/vault.yml
    - ./inventory/group_vars/all.yml
  serial: 1
  roles:
    - role: common/upgrade
  tags:
    - os-upgrade
    - never

# All
- name: Debian Dist-Upgrade
  hosts: all
  become: true
  vars_files:
    - ./inventory/group_vars/vault.yml
    - ./inventory/group_vars/all.yml
  serial: 1
  roles:
    - role: common/dist-upgrade
  tags:
    - dist-upgrade
    - never

# Gateway
- name: Setup Gateway
  hosts: gateway
  become: true
  vars_files:
    - ./inventory/group_vars/vault.yml
    - ./inventory/group_vars/all.yml
    - ./inventory/group_vars/gateway.yml
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags: always
  roles:
    - role: common/hostname
      tags: [gateway, hostname]
    - role: common/locales
      tags: [gateway, locales]
    - role: common/ssh
      tags: [gateway, ssh]
    - role: common/hardening
      tags: [gateway, hardening]
    - role: common/docker
      tags: [gateway, docker]
    - role: gateway/haproxy
      tags: [gateway, haproxy]
    - role: gateway/wireguard
      tags: [gateway, wireguard]
    - role: gateway/pihole
      tags: [gateway, pihole]
    - role: gateway/crowdsec
      tags: [gateway, crowdsec]
  tags:
    - gateway

# K3S - Deploy
- name: Setup K3S Prerequisites
  hosts: k3s
  become: true
  vars_files:
    - ./inventory/group_vars/vault.yml
    - ./inventory/group_vars/all.yml
    - ./inventory/group_vars/k3s.yml
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags: always
  roles:
    - role: common/hostname
      tags: [hostname]
    - role: common/locales
      tags: [locales]
    - role: common/ssh
      tags: [ssh]
    - role: common/hardening
      tags: [hardening]
    - role: k3s/prereq
      tags: [k3s-prereq]
    - role: k3s/download
      tags: [k3s-download]
    - role: k3s/registry
      tags: [k3s-registry]
    - role: k3s/storage
      tags: [k3s-storage]
  tags:
    - k3s
    - k3s-deploy
    - k3s-init

- name: Deploy K3S Masters
  hosts: masters
  become: true
  serial: 1
  vars_files:
    - ./inventory/group_vars/vault.yml
    - ./inventory/group_vars/all.yml
    - ./inventory/group_vars/k3s.yml
  roles:
    - role: k3s/deploy/masters
  tags:
    - k3s
    - k3s-deploy
    - k3s-masters

# K3S - CNI bootstrap. Only does anything when k3s was installed without a
# CNI (k3sCni: cilium) and none is present yet. Must run BEFORE workers so
# they get a CNI as they join, and before the GitOps bootstrap — ArgoCD's
# own pods cannot schedule until a CNI exists. See the role for detail.
- name: Bootstrap the CNI
  hosts: masters[0]
  become: true
  vars_files:
    - ./inventory/group_vars/vault.yml
    - ./inventory/group_vars/all.yml
    - ./inventory/group_vars/k3s.yml
  roles:
    - role: k3s/cni
      when: k3sCni | default('flannel') == 'cilium'
  tags:
    - k3s
    - k3s-deploy
    - k3s-cni

- name: Deploy K3S Workers
  hosts: workers
  become: true
  serial: 1
  vars_files:
    - ./inventory/group_vars/vault.yml
    - ./inventory/group_vars/all.yml
    - ./inventory/group_vars/k3s.yml
  roles:
    - role: k3s/deploy/workers
  tags:
    - k3s
    - k3s-deploy
    - k3s-workers

- name: Setup K3S Users
  hosts: localhost
  become: false
  environment:
    K8S_AUTH_KUBECONFIG: "{{ K8S_AUTH_KUBECONFIG }}"
  vars_files:
    - ./inventory/group_vars/vault.yml
    - ./inventory/group_vars/all.yml
    # localhost is not in the k3s group: load its group_vars explicitly for
    # k3sApiServerEndpoint / k3sCaData used by the kubeconfig template.
    - ./inventory/group_vars/k3s.yml
  roles:
    - role: k3s/users
  tags:
    - k3s
    - k3s-deploy
    - k3s-users

# K3S - Destroy
# `never` is load-bearing: without it, `--tags all` (run.sh's default) would
# run this play right after the deploy plays and wipe the cluster it just
# built. Destroy must always be requested explicitly with `-t k3s-destroy`.
- name: Destroy K3S Cluster
  hosts: k3s
  become: true
  vars_files:
    - ./inventory/group_vars/vault.yml
    - ./inventory/group_vars/all.yml
    - ./inventory/group_vars/k3s.yml
  roles:
    - role: k3s/destroy
  tags:
    - k3s-destroy
    - never

# K3S - Cilium watchdog (arm the dead-man switch fleet-wide BEFORE the first
# canary node — safe anytime, does not touch k3s or CNI state)
- name: Arm the Cilium watchdog
  hosts: k3s
  become: true
  vars_files:
    - ./inventory/group_vars/vault.yml
    - ./inventory/group_vars/all.yml
    - ./inventory/group_vars/k3s.yml
  tasks:
    # include_role (NOT include_tasks): preserves role context so the
    # templates/ lookup resolves — include_tasks from a play searches only
    # playbook-relative dirs and fails on cilium-watchdog.sh.j2.
    - name: Include Cilium watchdog tasks
      ansible.builtin.include_role:
        name: k3s/prereq
        tasks_from: cilium-watchdog
  tags:
    - cilium-watchdog
    - never

# K3S - Cilium FINAL FLIP (rolling migration step 6: run only after ALL nodes
# are Cilium-managed and group_vars/k3s.yml flags were switched)
- name: Migrate K3S from Flannel to Cilium
  hosts: k3s
  become: true
  serial: 1
  vars_files:
    - ./inventory/group_vars/vault.yml
    - ./inventory/group_vars/all.yml
    - ./inventory/group_vars/k3s.yml
  tasks:
    # include_role (NOT include_tasks): same template-resolution reason
    # as the watchdog play above.
    - name: Include Cilium migration tasks
      ansible.builtin.include_role:
        name: k3s/prereq
        tasks_from: migrate-cilium
  tags:
    - cilium-migrate
    - never

# K3S - Kernel Upgrade (Debian arm64 with 52-bit VA for Cilium envoy/tcmalloc)
# Uses RPi tryboot mechanism — power cycle reverts to original kernel on failure.
# Run one node at a time: ansible-playbook install.yml --tags kernel-upgrade --limit pi8
- name: Upgrade kernel to Debian arm64 (52-bit VA)
  hosts: k3s
  become: true
  serial: 1
  vars_files:
    - ./inventory/group_vars/vault.yml
    - ./inventory/group_vars/all.yml
  roles:
    - role: common/kernel-upgrade
  tags:
    - kernel-upgrade
    - never
