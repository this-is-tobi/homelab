---
gatewayIp: "{{ hostvars[groups['gateway'][0]]['ansible_host'] }}"
haproxy:
  version: alpine3.22
  # LAN CIDR allowed to reach the kube-apiserver (:6443) and the HAProxy
  # stats page. Defaults to the gateway's /24 when empty — set it explicitly
  # if your LAN uses a different mask.
  lanCidr: ""
  extraKubeAllowedIps: ""
  allowedIps: ""
  # --- Dual ingress-controller routing (for migrating between ingress
  # controllers without downtime: route some SNIs to one, the rest to the
  # other, then cut over fully once satisfied) ---
  # ingressDefault: apisix       # backend for port 80 + unmatched SNIs (apisix|traefik)
  # traefikHttpPort: 8080        # traefik node port (HTTP) while apisix owns 80
  # traefikHttpsPort: 8443       # traefik node port (TLS) while apisix owns 443
  # traefikHosts: []             # exact SNIs routed to traefik
  # traefikHostSuffixes: []      # SNI suffixes for wildcards
pihole:
  enabled: false
  version: 2026.04.1
  domain: pihole.{{ localRootDomain }}
  password: "{{ vault_pihole_password }}"
wireguard:
  enabled: false
  # wg-easy v15 (config in its own DB, seeded from INIT_* on FIRST start —
  # later changes go through the UI or a fresh /services/wireguard/.wg-easy).
  version: "15"
  domain: "vpn.{{ rootDomain }}"
  # Admin UI account (min 12-char password; auto-generated when empty).
  adminUser: admin
  password: "{{ vault_wireguard_password }}"
  # VPN client network. `ipv4Cidr` wins; the legacy `ipRange: 10.8.0.x` form
  # is converted to a /24.
  ipRange: 10.8.0.x
  # ipv4Cidr: 10.8.0.0/24
  # ipv6Cidr: fd42:42:42::/64
  # disableIpv6: true   # IPv4-only LAN (default); false adds the v6 sysctls
  allowedIps: "0.0.0.0/0, ::/0"
crowdsec:
  enabled: false
  version: v1.7.7
  gid: "1000"
  # console_key: "{{ vault_crowdsec_console_key | default('') }}"
  # console_name: ""       # engine name shown in the console
  # console_tags: ""       # space-separated tags
  # collections: []        # override gateway_crowdsec_default_collections
  # acquis_files: []       # override gateway_crowdsec_default_acquis_files
  # acquis_docker: []      # override gateway_crowdsec_default_acquis_docker
  # whitelists: []         # override gateway_crowdsec_default_whitelists
  # memory_limit: "256M"   # override gateway_crowdsec_default_memory_limit
