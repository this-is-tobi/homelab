[defaults]
nocows = True
roles_path = ./roles
inventory  = ./inventory
playbook_dir = ./
remote_tmp = $HOME/.ansible/tmp
local_tmp  = $HOME/.ansible/tmp
become = False
vault_password_file = .vault_password
gathering = smart
fact_caching = jsonfile
fact_caching_connection = ~/.ansible/facts_cache
fact_caching_timeout = 3600

[ssh_connection]
# publickey FIRST but password still allowed: the documented bootstrap path
# (fresh Pi, only vault_ansible_password set) authenticates with sshpass
# until common/ssh installs the key — publickey-only would break it.
ssh_args = -o PreferredAuthentications=publickey,password -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
