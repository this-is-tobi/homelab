---
- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    reload: true

# Expected to fail on kernels without the wireguard module (pre-5.6 or
# stripped builds) — wireguard is optional for k3s itself, so tolerate that
# one case instead of failing the play.
- name: Load wireguard kernel module
  community.general.modprobe:
    name: wireguard
    state: present
  failed_when: false

- name: Ensure wireguard module loads at boot
  ansible.builtin.lineinfile:
    path: /etc/modules-load.d/wireguard.conf
    line: wireguard
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Load br_netfilter kernel module
  community.general.modprobe:
    name: br_netfilter
    state: present

- name: Ensure br_netfilter loads at boot
  ansible.builtin.copy:
    content: br_netfilter
    dest: /etc/modules-load.d/br_netfilter.conf
    owner: root
    group: root
    mode: "0644"

- name: Enable IPv6 forwarding
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    state: present
    reload: true
  when: ansible_facts["all_ipv6_addresses"] | default([]) | length > 0

- name: Enable IPv6 router advertisements
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.accept_ra
    value: "2"
    state: present
    reload: true

- name: Activating cgroup support
  ansible.builtin.lineinfile:
    # path: /boot/cmdline.txt
    path: /boot/firmware/cmdline.txt
    regexp: "^((?!.*\\bcgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory\\b).*)$"
    line: "\\1 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory"
    backrefs: true

