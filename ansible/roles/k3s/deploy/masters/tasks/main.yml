---
# Primary election is inventory-driven: the first host of the `masters` group
# bootstraps the cluster (--cluster-init), everyone else joins it. Do NOT use
# ansible_facts.default_ipv4 for this — the default route may sit on another
# interface (second NIC, VLAN, WireGuard) than ansible_host, which would
# silently leave the cluster with no --cluster-init master at all.
- name: Determine whether this host is the primary master
  ansible.builtin.set_fact:
    masters_is_primary: "{{ inventory_hostname == groups['masters'][0] }}"

- name: Define masters init args
  ansible.builtin.set_fact:
    k3s_init_server_args: >-
      {{ '--cluster-init' if masters_is_primary
      else '--server https://' + k3sApiServerEndpoint + ':6443 --token-file /etc/rancher/k3s/token' }}
  no_log: true

# Same fallback chain as the workers role: prefer the runtime token fact set
# on the primary master earlier in this run, then the vaulted k3sToken, then
# the token fetched to the controller by a previous run
# (inventory/group_vars/.k3sToken) for --limit runs on a single secondary.
- name: Resolve k3s join token (secondary masters)
  ansible.builtin.set_fact:
    masters_k3s_join_token: >-
      {{ (hostvars[groups['masters'][0]]['k3s_token'] | default(''))
         or (k3sToken | default(''))
         or lookup('ansible.builtin.file',
                   playbook_dir + '/inventory/group_vars/.k3sToken',
                   errors='ignore')
         or '' }}
  no_log: true
  when: not masters_is_primary

- name: Assert k3s join token is available (secondary masters)
  ansible.builtin.assert:
    that:
      - masters_k3s_join_token | trim | length > 0
    fail_msg: >-
      No k3s join token available: run the play with the primary master
      included, set vault_k3s_token in inventory/group_vars/vault.yml, or
      make sure inventory/group_vars/.k3sToken exists from a previous run.
    quiet: true
  when: not masters_is_primary

- name: Deploy k3s token file for joining masters
  ansible.builtin.copy:
    content: "{{ masters_k3s_join_token | trim }}"
    dest: /etc/rancher/k3s/token
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not masters_is_primary

- name: Copy k3s service file
  register: k3s_service
  ansible.builtin.template:
    src: k3s.service.j2
    dest: "{{ k3sSystemdDir }}/k3s.service"
    owner: root
    group: root
    mode: "0644"

- name: Enable and check k3s service
  register: masters_k3s_started
  ansible.builtin.systemd:
    name: k3s
    daemon_reload: true
    state: started
    enabled: true
  timeout: 300
  retries: 3
  delay: 10

# Only restart when the unit actually changed — an idempotent re-run must
# never bounce the control plane (the old unconditional `state: restarted`
# rolled the whole control plane on every run). Skipped when the task above
# just started the service (fresh install / stopped service), which already
# runs the new unit. The play runs serial: 1, so this stays a rolling restart.
- name: Restart k3s server to apply changed unit
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  timeout: 300
  retries: 3
  delay: 10
  when: k3s_service.changed and not masters_k3s_started.changed

- name: Wait for node-token
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token

- name: Read node-token from master
  ansible.builtin.slurp:
    path: /var/lib/rancher/k3s/server/node-token
  register: k3s_node_token

- name: Store Master node-token
  ansible.builtin.set_fact:
    k3s_token: "{{ k3s_node_token.content | b64decode | regex_replace('\n', '') }}"
  no_log: true

- name: Fetch k3sToken
  delegate_to: localhost
  become: false
  ansible.builtin.copy:
    content: "{{ k3s_token }}"
    dest: "{{ playbook_dir }}/inventory/group_vars/.k3sToken"
    mode: "0600"
  no_log: true
  when: masters_is_primary

- name: Create directory .kube
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "u=rwx,g=rx,o="

- name: Copy config file to user home directory
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ ansible_facts['user_dir'] }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    mode: "u=rw,g=,o="

- name: Configure kubectl cluster to primary master
  ansible.builtin.command: >-
    k3s kubectl config set-cluster default
      --server https://{{ k3sApiServerEndpoint }}:6443
      --kubeconfig {{ ansible_facts['user_dir'] }}/.kube/config
  changed_when: true

- name: Create kubectl symlink
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/kubectl
    state: link
    force: true

- name: Create crictl symlink
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: /usr/local/bin/crictl
    state: link
    force: true

- name: Fetch kube config
  ansible.builtin.fetch:
    src: "{{ ansible_facts['user_dir'] }}/.kube/config"
    dest: ~/.kube/config.d/homelab
    flat: true
  when: masters_is_primary

- name: Get cluster CA data
  ansible.builtin.shell:
    cmd: |
      kubectl config view --raw -o jsonpath='{ .clusters[0].cluster.certificate-authority-data }'
  when: masters_is_primary
  register: k3s_ca_data
  changed_when: false

- name: Fetch cluster CA data
  delegate_to: localhost
  become: false
  ansible.builtin.copy:
    content: "{{ k3s_ca_data.stdout }}"
    dest: "{{ playbook_dir }}/inventory/group_vars/.k3sCaData"
    mode: "0600"
  when: masters_is_primary
