---
- name: Remove pihole when disabled
  when: not pihole.enabled
  block:
    - name: Stop pihole if running
      community.docker.docker_compose_v2:
        state: absent
        project_src: /services/pihole
        files:
          - docker-compose.yml
      # Expected to fail when the service was never deployed (no compose
      # project / docker absent) — teardown must stay idempotent.
      failed_when: false

    - name: Remove pihole service dir
      ansible.builtin.file:
        path: /services/pihole
        state: absent

- name: Deploy pihole when enabled
  when: pihole.enabled
  block:
    # Effective admin password: the vaulted value when provided, otherwise a
    # random one generated ONCE on the controller and persisted at
    # inventory/group_vars/.pihole_password (gitignored). The password lookup
    # re-reads that file on later runs, so re-running the play never silently
    # rotates the password.
    - name: Resolve pihole admin password
      ansible.builtin.set_fact:
        gateway_pihole_password: >-
          {{ pihole.password
             if (pihole.password | default('') | length > 0)
             else lookup('ansible.builtin.password',
                         playbook_dir + '/inventory/group_vars/.pihole_password',
                         length=24, chars=['ascii_letters', 'digits']) }}
      no_log: true

    - name: Assert pihole admin password is set
      ansible.builtin.assert:
        that:
          - gateway_pihole_password | length > 0
        fail_msg: "pihole admin password resolved empty — refusing to deploy an unauthenticated admin UI"
        quiet: true

    - name: Create pihole service dir
      ansible.builtin.file:
        path: /services/pihole
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Copy pihole env file
      ansible.builtin.template:
        src: pihole.env.j2
        dest: /services/pihole/.env.pihole
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Copy docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: /services/pihole/docker-compose.yml
        owner: root
        group: root
        mode: "0640"

    - name: Create dnsmasq.d dir
      ansible.builtin.file:
        path: /services/pihole/.pihole/etc-dnsmasq.d
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Copy local-domain dnsmasq config
      ansible.builtin.template:
        src: dnsmasq-local-domains.conf.j2
        dest: /services/pihole/.pihole/etc-dnsmasq.d/05-int-domain.conf
        owner: root
        group: root
        mode: "0640"
      notify: Restart pihole

    - name: Launch pihole
      community.docker.docker_compose_v2:
        state: present
        project_src: /services/pihole
        files:
          - docker-compose.yml
