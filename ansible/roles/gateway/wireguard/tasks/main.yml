---
- name: Remove wireguard when disabled
  when: not wireguard.enabled
  block:
    - name: Stop wireguard if running
      community.docker.docker_compose_v2:
        state: absent
        project_src: /services/wireguard
        files:
          - docker-compose.yml
      # Expected to fail when the service was never deployed (no compose
      # project / docker absent) — teardown must stay idempotent.
      failed_when: false

    - name: Remove wireguard service dir
      ansible.builtin.file:
        path: /services/wireguard
        state: absent

- name: Deploy wireguard when enabled
  when: wireguard.enabled
  block:
    # Effective admin password: the vaulted value when provided, otherwise a
    # random one generated ONCE on the controller and persisted at
    # inventory/group_vars/.wireguard_password (gitignored). The password
    # lookup re-reads that file on later runs, so re-running the play never
    # silently rotates the password.
    - name: Resolve wireguard admin password
      ansible.builtin.set_fact:
        gateway_wireguard_password: >-
          {{ wireguard.password
             if (wireguard.password | default('') | length > 0)
             else lookup('ansible.builtin.password',
                         playbook_dir + '/inventory/group_vars/.wireguard_password',
                         length=24, chars=['ascii_letters', 'digits']) }}
      no_log: true

    # wg-easy v15 refuses passwords shorter than 12 characters at setup.
    - name: Assert wireguard admin password is set
      ansible.builtin.assert:
        that:
          - gateway_wireguard_password | length >= 12
        fail_msg: "wireguard admin password must be at least 12 characters (wg-easy v15) — refusing to deploy"
        quiet: true

    # v15 takes a CIDR; the legacy `ipRange: 10.8.0.x` form is still accepted
    # and converted to /24.
    - name: Resolve wireguard IPv4 CIDR
      ansible.builtin.set_fact:
        gateway_wireguard_ipv4_cidr: >-
          {{ wireguard.ipv4Cidr
             if (wireguard.ipv4Cidr | default('') | length > 0)
             else (wireguard.ipRange | default('10.8.0.x')) | regex_replace('\.x$', '.0/24') }}

    - name: Assert wireguard IPv4 CIDR is valid
      ansible.builtin.assert:
        that:
          # ipaddr('net') returns the network string, or False when invalid
          - (gateway_wireguard_ipv4_cidr | ansible.utils.ipaddr('net')) is string
        fail_msg: "wireguard.ipv4Cidr / ipRange does not resolve to a valid IPv4 network (got '{{ gateway_wireguard_ipv4_cidr }}')"
        quiet: true

    - name: Create wireguard service dir
      ansible.builtin.file:
        path: /services/wireguard
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Copy wireguard env file
      ansible.builtin.template:
        src: wireguard.env.j2
        dest: /services/wireguard/.env.wireguard
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Copy docker-compose file
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: /services/wireguard/docker-compose.yml
        owner: root
        group: root
        mode: "0640"

    - name: Launch wireguard
      community.docker.docker_compose_v2:
        state: present
        project_src: /services/wireguard
        files:
          - docker-compose.yml

    # The API accepts HTTP Basic auth on every call (no session needed) and
    # is bound to 127.0.0.1 — so this runs on the gateway. Retried while the
    # container finishes its first-start setup.
    - name: List wireguard clients
      ansible.builtin.uri:
        url: http://127.0.0.1:51821/api/client
        url_username: "{{ wireguard.adminUser | default('admin') }}"
        url_password: "{{ gateway_wireguard_password }}"
        force_basic_auth: true
        return_content: true
        status_code: [200]
      register: gateway_wireguard_clients
      until: gateway_wireguard_clients.status == 200
      retries: 12
      delay: 5
      no_log: true

    # One client per admin user; `state: absent` deletes the client.
    - name: Manage wireguard clients
      ansible.builtin.include_tasks: users.yml
      loop: "{{ adminUsers }}"
      loop_control:
        label: "{{ item.username }}"
