---
# The wg-easy UI/API is bound to 127.0.0.1 on the gateway (see
# docker-compose.yml.j2), so these calls must run ON the gateway host —
# from the controller the port is unreachable by design.
- name: Login to wireguard
  ansible.builtin.uri:
    url: http://127.0.0.1:51821/api/session
    force_basic_auth: true
    body_format: json
    body:
      password: "{{ gateway_wireguard_password }}"
    status_code: [200]
  register: gateway_wireguard_login
  no_log: true

- name: Create wireguard user
  ansible.builtin.uri:
    url: http://127.0.0.1:51821/api/wireguard/client
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ item.username }}"
    status_code: [200]
    headers:
      Cookie: "{{ gateway_wireguard_login.cookies_string }}"
