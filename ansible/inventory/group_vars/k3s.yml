---
k3sVersion: "v1.35.3+k3s1"
k3sToken: "{{ vault_k3s_token }}"
k3sCaData: "{{ vault_k3s_ca_data }}"
k3sSystemdDir: /etc/systemd/system
k3sDataDir: /var/lib/rancher/k3s
k3sFlanneliface: eth0
k3sApiServerEndpoint: "{{ hostvars[groups['gateway'][0]]['ansible_host'] }}"
k3sMasterIP: "{{ hostvars[groups['masters'][0]]['ansible_host'] }}"
k3sNodeIP: "{{ ansible_facts['eth0']['ipv4']['address'] }}"

# --- Kubelet DNS upstreams (see inventory-example/group_vars/k3s.yml) ---
# Every k3s node gets --resolv-conf pointing at this file, rendered by
# k3s/prereq, instead of the host's /etc/resolv.conf: that one is written by
# each node's own DHCP/RA client, differs between nodes and can exceed the
# 3-nameserver resolver limit. CoreDNS (dnsPolicy: Default, random upstream
# per query) and hostNetwork pods resolve with this list, so it must be ONE
# coherent upstream set — never mix the Pi-hole with public resolvers.
# Quad9 only, the same upstreams the Pi-hole itself forwards to. 1 to 3
# entries. The host's own resolver is left alone.
k3sResolvConfPath: /etc/rancher/k3s/resolv.conf
k3sResolvConfNameservers:
  - 9.9.9.9
  - 9.9.9.10

# --- Networking choices (see inventory-example/group_vars/k3s.yml for the
# full explanation of each option and how to move between them) ---
#
# cilium: sole CNI here. The `cilium` app must stay enabled in
#   argo-cd/instances/homelab/core.yaml — this flag only stops k3s from
#   installing flannel, it doesn't deploy Cilium. kube-proxy is deliberately
#   KEPT (no --disable-kube-proxy) so Cilium never attaches BPF programs to
#   the physical uplink; see argo-cd/apps/cilium/values.yaml.
#   ⚠ --flannel-backend is a k3s CRITICAL flag: all servers must agree.
#   Flip the cluster-init master first, then the others, then workers.
k3sCni: cilium
# Values used if the CNI ever has to be bootstrapped on a rebuilt cluster
# (k3s/cni role). No-op on the running cluster — the role skips when a CNI
# is already present, and ArgoCD owns cilium from then on.
k3sCniChartValues: argo-cd/instances/homelab/values/core/cilium.yaml
#
# false: no ServiceLB. Traefik's Service carries a static `spec.externalIPs`
#   list instead (argo-cd/instances/homelab/values/core/traefik.yaml), so
#   kube-proxy DNATs nodeIP:80/443 to it on every node. Also avoids
#   ServiceLB's wildcard-LB-VIP interaction with Cilium's BPF service
#   lookup. Roll uniformly across all masters.
k3sServiceLb: false
#
# true: masters run etcd, which is latency-sensitive to disk/CPU contention
#   on this cluster's Pi4/SD-USB-class storage. Soft (PreferNoSchedule), so
#   DaemonSets need no toleration changes. Heavy stateful workloads (CNPG,
#   Vault) additionally get a HARD exclusion via
#   `nodeSelector: {node-type: worker}` in their own app values.
k3sTaintMasters: true

# Composed from the choices above — normally no need to edit these directly.
# --flannel-backend / --disable-network-policy are SERVER-only flags;
# --flannel-iface applies to both servers and agents.
k3sCniServerArgs: >-
  {% if k3sCni == 'cilium' %}--flannel-backend=none --disable-network-policy{% else %}--flannel-iface {{ k3sFlanneliface }}{% endif %}
k3sCniAgentArgs: >-
  {% if k3sCni == 'cilium' %}{% else %}--flannel-iface {{ k3sFlanneliface }}{% endif %}
k3sServiceLbArgs: "{{ '' if k3sServiceLb | bool else '--disable servicelb' }}"
k3sMasterTaintArgs: >-
  {{ '--node-taint node-role.kubernetes.io/control-plane=true:PreferNoSchedule' if k3sTaintMasters | bool else '' }}

# Shared by servers and agents (both compose it below).
k3sExtraArgs: >-
  --node-name {{ inventory_hostname }}
  --node-ip={{ k3sNodeIP }}
  --resolv-conf {{ k3sResolvConfPath }}
k3sExtraServerArgs: >-
  {{ k3sExtraArgs }}
  {{ k3sCniServerArgs }}
  {{ k3sServiceLbArgs }}
  {{ k3sMasterTaintArgs }}
  --tls-san {{ hostvars[groups['gateway'][0]]['ansible_host'] }}
  --disable local-storage
  --disable traefik
  --write-kubeconfig-mode 600
  --node-label node-type=master
# --etcd-arg heartbeat-interval=250  --etcd-arg election-timeout=2500
k3sExtraAgentArgs: >-
  {{ k3sExtraArgs }}
  {{ k3sCniAgentArgs }}
  --node-label node-type=worker
